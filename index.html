          </button>
          {open && <HistoryDetails entry={entry} />}
        </article>
      );
    };

    const HistoryScreen = () => {
      const app = useApp();
      const [filter, setFilter] = useState('all');
      const list = useMemo(() => {
        const arr = app.history.slice().sort((a, b) => b.date - a.date);
        if (filter === 'strength') return arr.filter(e => e.type !== 'cardio');
        if (filter === 'cardio') return arr.filter(e => e.type === 'cardio');
        return arr;
      }, [app.history, filter]);

      const FILTERS = [{ id: 'all', label: 'Todos' }, { id: 'strength', label: 'Musculação' }, { id: 'cardio', label: 'Cardio' }];

      return (
        <div className="a-fade">
          <ScreenHeader eyebrow="Registro" title="Histórico"
            subtitle={`${app.history.length} ${app.history.length === 1 ? 'sessão registrada' : 'sessões registradas'}`} />

          <div className="flex gap-2 mb-4">
            {FILTERS.map(f => (
              <button key={f.id} className={`chip flex-1 ${filter === f.id ? 'chip-on' : ''}`}
                onClick={() => setFilter(f.id)} aria-pressed={filter === f.id}>{f.label}</button>
            ))}
          </div>

          {list.length === 0 ? (
            <EmptyState icon="history" title="Nada por aqui ainda"
              text="Finalize um treino ou uma sessão de cardio para ver o registro nesta tela."
              action={<button className="btn btn-primary" onClick={() => app.setView('workout')}>Ir para o treino</button>} />
          ) : (
            <div className="space-y-3">
              {list.map(entry => (
                <HistoryCard key={entry.id} entry={entry} workoutData={app.workoutData} onDelete={app.confirmDeleteHistory} />
              ))}
            </div>
          )}
          <div className="h-6" />
        </div>
      );
    };

    /* ============================================================
       18. ESTATÍSTICAS / PROGRESSO
       ============================================================ */
    const StatsDashboard = () => {
      const app = useApp();
      const { history, userStats } = app;

      const m = useMemo(() => {
        const sessions = history.slice().sort((a, b) => a.date - b.date);
        const strength = sessions.filter(e => e.type !== 'cardio');
        const totalMs = sessions.reduce((a, e) => a + (e.duration || 0), 0);
        const volume = sessions.reduce((a, e) => a + (e.volume || 0), 0);
        const sets = sessions.reduce((a, e) => a + (e.totalSets || 0), 0);

        // sequência: dias consecutivos com treino, terminando hoje ou ontem
        const days = new Set(sessions.map(e => dayStamp(e.date)));
        let streak = 0;
        const cursor = new Date();
        if (!days.has(dayStamp(cursor.getTime()))) cursor.setDate(cursor.getDate() - 1);
        while (days.has(dayStamp(cursor.getTime()))) { streak++; cursor.setDate(cursor.getDate() - 1); }

        // frequência por semana (8 últimas)
        const weeks = [];
        for (let i = 7; i >= 0; i--) {
          const d = new Date(); d.setDate(d.getDate() - i * 7);
          const id = weekIdOf(d.getTime());
          if (!weeks.find(w => w.id === id)) weeks.push({ id, label: 'S' + id.split('-W')[1], count: 0 });
        }
        sessions.forEach(e => { const w = weeks.find(x => x.id === (e.weekId || weekIdOf(e.date))); if (w) w.count++; });

        const last = strength.slice(-10);
        const cardioSessions = sessions.filter(e => e.type === 'cardio');

        // cargas por exercício
        const byExercise = {};
        strength.forEach(e => {
          (e.exercises || []).forEach(ex => {
            const best = Math.max(0, ...ex.sets.filter(s => s.completed).map(s => num(s.weight)));
            if (!best) return;
            if (!byExercise[ex.name]) byExercise[ex.name] = [];
            byExercise[ex.name].push({ date: e.date, weight: best });
          });
        });

        return {
          total: sessions.length, strengthCount: strength.length, cardioCount: cardioSessions.length,
          totalMs, volume, sets, streak, weeks, last, byExercise,
          avgMin: sessions.length ? Math.round(totalMs / sessions.length / 60000) : 0
        };
      }, [history]);

      const exNames = Object.keys(m.byExercise).sort();
      const [selectedEx, setSelectedEx] = useState('');
      const activeEx = selectedEx && m.byExercise[selectedEx] ? selectedEx : (exNames[0] || '');
      const exSeries = activeEx ? m.byExercise[activeEx].slice(-12) : [];
      const bodyLog = (userStats.weightLog || []).slice(-14);

      return (
        <div className="a-fade">
          <ScreenHeader eyebrow="Evolução" title="Progresso" subtitle="Seus números desde o primeiro registro" />

          <div className="grid grid-cols-2 gap-2.5 mb-4">
            <StatTile label="Treinos totais" value={m.total} icon="dumbbell" hint={`${m.strengthCount} força · ${m.cardioCount} cardio`} />
            <StatTile label="Tempo total" value={m.totalMs ? fmtDuration(m.totalMs) : '0 min'} icon="clock" hint={`Média ${m.avgMin} min`} />
            <StatTile label="Sequência atual" value={m.streak} unit={m.streak === 1 ? 'dia' : 'dias'} icon="flame" hint="Dias consecutivos" />
            <StatTile label="Volume total" value={m.volume ? fmtNumber(m.volume) : 0} unit="kg" icon="trending" hint={`${m.sets} séries registradas`} />
          </div>

          {m.total === 0 ? (
            <EmptyState icon="chart" title="Sem dados ainda"
              text="Os gráficos aparecem assim que você finalizar o primeiro treino."
              action={<button className="btn btn-primary" onClick={() => app.setView('workout')}>Começar agora</button>} />
          ) : (
            <div className="space-y-3">
              <section className="card p-4">
                <SectionTitle>Frequência</SectionTitle>
                <p className="text-xs text-faint -mt-2 mb-3">Sessões por semana (últimas 8)</p>
                <ChartBox type="bar" labels={m.weeks.map(w => w.label)} stepSize={1}
                  datasets={[{ label: 'Sessões', data: m.weeks.map(w => w.count), color: '#E10600' }]} height={180} />
              </section>

              <section className="card p-4">
                <SectionTitle>Duração</SectionTitle>
                <p className="text-xs text-faint -mt-2 mb-3">Minutos por treino de força (últimos 10)</p>
                {m.last.length ? (
                  <ChartBox type="line" labels={m.last.map(e => new Date(e.date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }))}
                    datasets={[{ label: 'Minutos', data: m.last.map(e => toMin(e.duration)), color: '#FFFFFF', fillColor: 'rgba(255,255,255,0.06)' }]} height={180} />
                ) : <p className="text-sm text-faint">Sem treinos de força registrados.</p>}
              </section>

              <section className="card p-4">
                <SectionTitle>Volume por treino</SectionTitle>
                <p className="text-xs text-faint -mt-2 mb-3">Carga × repetições estimadas (kg)</p>
                {m.last.some(e => e.volume > 0) ? (
                  <ChartBox type="bar" labels={m.last.map(e => new Date(e.date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }))}
                    datasets={[{ label: 'Volume', data: m.last.map(e => Math.round(e.volume || 0)), color: '#E10600' }]} height={180} />
                ) : <p className="text-sm text-faint">Registre cargas nas séries para acompanhar o volume.</p>}
              </section>

              <section className="card p-4">
                <SectionTitle>Evolução de carga</SectionTitle>
                {exNames.length ? (
                  <React.Fragment>
                    <label className="label" htmlFor="ex-select">Exercício acompanhado</label>
                    <select id="ex-select" className="input mb-3" value={activeEx} onChange={e => setSelectedEx(e.target.value)}>
                      {exNames.map(n => <option key={n} value={n}>{n}</option>)}
                    </select>
                    <ChartBox type="line" labels={exSeries.map(p => new Date(p.date).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }))}
                      datasets={[{ label: 'Carga (kg)', data: exSeries.map(p => p.weight), color: '#E10600' }]} height={180} />
                  </React.Fragment>
                ) : <p className="text-sm text-faint">Marque séries com carga registrada para acompanhar a progressão.</p>}
              </section>

              <section className="card p-4">
                <SectionTitle>Peso corporal</SectionTitle>
                {bodyLog.length > 1 ? (
                  <ChartBox type="line" labels={bodyLog.map(p => p.date.slice(8) + '/' + p.date.slice(5, 7))}
                    datasets={[{ label: 'Peso (kg)', data: bodyLog.map(p => p.weight), color: '#FFFFFF', fillColor: 'rgba(255,255,255,0.06)' }]} height={180} />
                ) : (
                  <p className="text-sm text-faint">Atualize seu peso no perfil ao longo das semanas para ver a curva aqui.</p>
                )}
              </section>
            </div>
          )}
          <div className="h-6" />
        </div>
      );
    };

    /* ============================================================
       19. PERFIL — IMC, água, meta
       ============================================================ */
    const BMI_BANDS = [
      { max: 18.5, label: 'Abaixo do peso', color: '#3F3F46' },
      { max: 25, label: 'Peso normal', color: '#FFFFFF' },
      { max: 30, label: 'Sobrepeso', color: '#7A0300' },
      { max: Infinity, label: 'Obesidade', color: '#E10600' }
    ];
    const bmiBand = (imc) => BMI_BANDS.find(b => imc < b.max) || BMI_BANDS[3];

    const BMICard = ({ imc }) => {
      if (!imc) {
        return (
          <section className="card p-5">
            <Eyebrow className="mb-2">IMC</Eyebrow>
            <p className="text-sm text-faint">Informe peso e altura para calcular.</p>
          </section>
        );
      }
      const band = bmiBand(imc);
      const pos = clamp(((imc - 15) / 25) * 100, 0, 100);
      return (
        <section className="card p-5">
          <div className="flex items-end justify-between mb-3">
            <div>
              <Eyebrow className="mb-1">IMC</Eyebrow>
              <div className="display text-5xl text-white leading-none">{imc.toFixed(1)}</div>
            </div>
            <span className="badge" style={{ color: band.color === '#FFFFFF' ? '#fff' : band.color, borderColor: band.color }}>
              {band.label}
            </span>
          </div>
          <div className="scale-track" aria-hidden="true">
            <div style={{ width: '14%', background: '#3F3F46' }} />
            <div style={{ width: '26%', background: '#FFFFFF' }} />
            <div style={{ width: '20%', background: '#7A0300' }} />
            <div style={{ width: '40%', background: '#E10600' }} />
          </div>
          <div className="relative h-4">
            <div className="absolute -top-1 w-0.5 h-4 bg-white" style={{ left: `${pos}%` }} aria-hidden="true" />
          </div>
          <div className="flex justify-between text-[10px] text-faint mono">
            <span>15</span><span>18.5</span><span>25</span><span>30</span><span>40</span>
          </div>
          <p className="text-[11px] text-faint mt-3">
            Referência estatística geral — não considera composição corporal e não substitui avaliação profissional.
          </p>
        </section>
      );
    };

    const WaterCard = ({ ml, cups, onCup }) => {
      if (!ml) {
        return (
          <section className="card p-5">
            <Eyebrow className="mb-2">Hidratação</Eyebrow>
            <p className="text-sm text-faint">Informe seu peso para ver a recomendação diária.</p>
          </section>
        );
      }
      const target = Math.ceil(ml / 250);
      const pct = (cups / target) * 100;
      return (
        <section className="card p-5">
          <div className="flex items-end justify-between mb-3">
            <div>
              <Eyebrow className="mb-1">Hidratação</Eyebrow>
              <div className="display text-4xl text-white leading-none">{fmtNumber(ml)} <span className="text-lg text-soft">ml</span></div>
              <p className="text-xs text-faint mt-1">{target} copos de 250 ml por dia</p>
            </div>
            <span className="text-brand"><Icon name="droplet" size={22} /></span>
          </div>
          <ProgressBar value={pct} thick className="mb-3" />
          <div className="flex flex-wrap gap-1.5">
            {Array.from({ length: target }).map((_, i) => (
              <button key={i} onClick={() => onCup(i + 1 === cups ? i : i + 1)}
                className={`w-9 h-9 rounded-lg border flex items-center justify-center transition-colors ${i < cups ? 'bg-brand border-brand text-white' : 'card-2 text-faint'}`}
                aria-pressed={i < cups} aria-label={`Marcar ${i + 1} copos consumidos`}>
                <Icon name="droplet" size={14} fill={i < cups ? 'currentColor' : 'none'} />
              </button>
            ))}
          </div>
          <p className="text-xs text-soft mt-3">{cups} de {target} copos hoje · {fmtNumber(cups * 250)} ml</p>
        </section>
      );
    };

    const ProfileScreen = () => {
      const app = useApp();
      const s = app.userStats;
      const weight = num(s.weight), height = num(s.height), goal = num(s.goalWeight);
      const start = num(s.startWeight) || weight;
      const imc = weight && height ? weight / Math.pow(height / 100, 2) : 0;
      const water = weight ? Math.round(weight * 35) : 0;
      const today = dayStamp(Date.now());
      const cups = s.water && s.water.date === today ? s.water.cups : 0;

      let goalPct = 0, remaining = 0;
      if (goal && start && start !== goal) {
        goalPct = clamp(((start - weight) / (start - goal)) * 100, 0, 100);
        remaining = Math.abs(weight - goal);
      }

      return (
        <div className="a-fade">
          <ScreenHeader eyebrow="Você" title="Meu perfil"
            right={<button className="btn btn-ghost btn-icon" onClick={() => app.setView('settings')} aria-label="Configurações"><Icon name="settings" size={18} /></button>} />

          <section className="card p-5 mb-3">
            <Eyebrow className="mb-3">Medidas</Eyebrow>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="label" htmlFor="p-weight">Peso (kg)</label>
                <input id="p-weight" type="number" inputMode="decimal" step="0.1" min="0" className="input input-num"
                  value={s.weight} placeholder="0" onChange={e => app.updateStat('weight', e.target.value)}
                  onBlur={e => app.logBodyWeight(e.target.value)} />
              </div>
              <div>
                <label className="label" htmlFor="p-height">Altura (cm)</label>
                <input id="p-height" type="number" inputMode="numeric" step="1" min="0" className="input input-num"
                  value={s.height} placeholder="0" onChange={e => app.updateStat('height', e.target.value)} />
              </div>
              <div>
                <label className="label" htmlFor="p-goal">Meta de peso (kg)</label>
                <input id="p-goal" type="number" inputMode="decimal" step="0.1" min="0" className="input input-num"
                  value={s.goalWeight} placeholder="0" onChange={e => app.updateStat('goalWeight', e.target.value)} />
              </div>
              <div>
                <label className="label" htmlFor="p-start">Peso inicial (kg)</label>
                <input id="p-start" type="number" inputMode="decimal" step="0.1" min="0" className="input input-num"
                  value={s.startWeight} placeholder="0" onChange={e => app.updateStat('startWeight', e.target.value)} />
              </div>
            </div>
          </section>

          {goal > 0 && weight > 0 && (
            <section className="card p-5 mb-3">
              <Eyebrow className="mb-3">Meta</Eyebrow>
              <div className="flex items-end justify-between mb-2">
                <span className="display text-4xl text-white">{weight} <span className="text-lg text-faint">kg</span></span>
                <span className="text-faint"><Icon name="chevronRight" size={18} /></span>
                <span className="display text-4xl text-brand">{goal} <span className="text-lg text-faint">kg</span></span>
              </div>
              <ProgressBar value={goalPct} thick />
              <div className="flex justify-between mt-2 text-xs">
                <span className="text-faint">Início: {start} kg</span>
                <span className="text-soft font-bold">Faltam {remaining.toFixed(1).replace('.0', '')} kg</span>
              </div>
            </section>
          )}

          <div className="grid gap-3 sm:grid-cols-2 mb-3">
            <BMICard imc={imc} />
            <WaterCard ml={water} cups={cups} onCup={app.setWaterCups} />
          </div>

          <section className="card p-5 mb-3">
            <Eyebrow className="mb-2">Objetivo</Eyebrow>
            <div className="flex flex-wrap gap-1.5 mb-3">
              {(s.goals || PLAN_GOALS).map(g => <span key={g} className="badge badge-outline-red">{g}</span>)}
            </div>
            <p className="text-sm text-soft">{PLAN_SUMMARY}</p>
          </section>

          <section className="card p-5 mb-3">
            <Eyebrow className="mb-3">Orientações do plano</Eyebrow>
            <ul className="space-y-2">
              {PLAN_NOTES.map((n, i) => (
                <li key={i} className="flex gap-2 text-sm text-soft">
                  <span className="text-brand mt-0.5"><Icon name="check" size={13} strokeWidth={3} /></span>{n}
                </li>
              ))}
            </ul>
          </section>

          <button className="btn btn-dark w-full justify-between" onClick={() => app.setView('settings')}>
            <span className="flex items-center gap-2"><Icon name="settings" size={17} /> Configurações</span>
            <Icon name="chevronRight" size={16} />
          </button>
          <div className="h-6" />
        </div>
      );
    };

    /* ============================================================
       20. CONFIGURAÇÕES
       ============================================================ */
    const SettingRow = ({ title, description, children }) => (
      <div className="flex items-center gap-4 py-3 border-b hairline last:border-0">
        <div className="flex-1 min-w-0">
          <p className="text-sm font-bold text-white">{title}</p>
          {description ? <p className="text-xs text-faint mt-0.5">{description}</p> : null}
        </div>
        {children}
      </div>
    );

    const Toggle = ({ on, onChange, label }) => (
      <button role="switch" aria-checked={on} aria-label={label} onClick={() => onChange(!on)}
        className="relative w-[52px] h-[30px] rounded-full border transition-colors flex-shrink-0"
        style={{ background: on ? 'var(--red)' : 'var(--surface-3)', borderColor: on ? 'var(--red)' : 'var(--line)' }}>
        <span className="absolute top-[3px] w-[22px] h-[22px] rounded-full bg-white transition-all"
          style={{ left: on ? '26px' : '3px' }} />
      </button>
    );

    const SettingsScreen = () => {
      const app = useApp();
      const st = app.settings;
      const fileRef = useRef(null);
      const presets = [30, 45, 60, 90, 120];

      return (
        <div className="a-fade">
          <ScreenHeader eyebrow="Perfil" title="Configurações" onBack={() => app.setView('profile')} />

          <section className="card p-5 mb-3">
            <SectionTitle>Timer</SectionTitle>
            <label className="label" htmlFor="rest-input">Tempo de descanso (segundos)</label>
            <div className="flex items-center gap-2 mb-3">
              <input id="rest-input" type="number" min="10" max="600" step="5" className="input input-num w-28"
                value={st.restSeconds}
                onChange={e => app.updateSetting('restSeconds', clamp(parseInt(e.target.value) || 10, 10, 600))} />
              <div className="flex gap-1.5 flex-wrap">
                {presets.map(p => (
                  <button key={p} className={`chip btn-sm ${st.restSeconds === p ? 'chip-on' : ''}`}
                    onClick={() => app.updateSetting('restSeconds', p)}>{p}s</button>
                ))}
              </div>
            </div>
            <SettingRow title="Iniciar descanso automaticamente" description="Ao marcar uma série como concluída">
              <Toggle on={st.autoStartRest} onChange={v => app.updateSetting('autoStartRest', v)} label="Iniciar descanso automaticamente" />
            </SettingRow>
            <SettingRow title="Vibrar ao terminar" description="Se o dispositivo suportar">
              <Toggle on={st.vibrate} onChange={v => app.updateSetting('vibrate', v)} label="Vibrar ao terminar o descanso" />
            </SettingRow>
            <SettingRow title="Notificações" description={app.notifyStatus}>
              <div className="flex items-center gap-2">
                {app.canRequestNotify && <button className="btn btn-ghost btn-sm" onClick={app.requestNotify}>Permitir</button>}
                <Toggle on={st.notify} onChange={v => app.updateSetting('notify', v)} label="Notificações do timer" />
              </div>
            </SettingRow>
          </section>

          <section className="card p-5 mb-3">
            <SectionTitle>Treino</SectionTitle>
            <button className="btn btn-dark w-full justify-between mb-2" onClick={() => app.setView('editor')}>
              <span className="flex items-center gap-2"><Icon name="edit" size={16} /> Editor de treino</span>
              <Icon name="chevronRight" size={16} />
            </button>
            <SettingRow title="Resetar semana" description={`Desmarca as séries de ${weekLabel(app.progress.weekId).toLowerCase()}. Histórico, cargas e configurações são mantidos.`}>
              <button className="btn btn-ghost btn-sm" onClick={app.confirmResetWeek}>Resetar</button>
            </SettingRow>
            <SettingRow title="Restaurar plano padrão" description="Volta aos exercícios do seu plano original">
              <button className="btn btn-danger btn-sm" onClick={app.confirmRestoreDefaults}>Restaurar</button>
            </SettingRow>
          </section>

          <section className="card p-5 mb-3">
            <SectionTitle>Dados</SectionTitle>
            <p className="text-xs text-faint mb-3">
              O backup inclui plano de treino, progresso da semana, cargas, histórico, dados pessoais e configurações.
            </p>
            <div className="flex gap-2">
              <button className="btn btn-primary flex-1" onClick={app.exportBackup}><Icon name="download" size={16} /> Exportar</button>
              <button className="btn btn-dark flex-1" onClick={() => fileRef.current && fileRef.current.click()}><Icon name="upload" size={16} /> Importar</button>
              <input ref={fileRef} type="file" accept="application/json,.json" className="sr-only"
                onChange={(e) => app.importBackup(e)} aria-label="Selecionar arquivo de backup" />
            </div>
          </section>

          <section className="card p-5 mb-3">
            <SectionTitle>Aparência</SectionTitle>
            <SettingRow title="Tema" description="O IRON TRACK usa tema escuro de alto contraste">
              <span className="badge badge-outline-red">Dark</span>
            </SettingRow>
            <SettingRow title="Reduzir animações" description="Menos movimento na interface">
              <Toggle on={st.reduceMotion} onChange={v => app.updateSetting('reduceMotion', v)} label="Reduzir animações" />
            </SettingRow>
          </section>

          <p className="text-[11px] text-faint text-center">IRON TRACK · dados salvos localmente neste dispositivo</p>
          <div className="h-6" />
        </div>
      );
    };

    /* ============================================================
       21. EDITOR DE TREINO
       ============================================================ */
    const emptyExercise = { name: '', alternatives: [], sets: 3, reps: '', obs: '', videoLink: '' };

    const ExerciseEditorModal = ({ open, draft, onChange, onClose, onSave }) => (
      <Modal open={open} title={draft && draft.index != null ? 'Editar exercício' : 'Novo exercício'}
        eyebrow="Editor" onClose={onClose} onConfirm={onSave} confirmLabel="Salvar">
        {draft && (
          <div className="space-y-3">
            <div>
              <label className="label" htmlFor="e-name">Nome</label>
              <input id="e-name" className="input" value={draft.name} autoFocus
                onChange={e => onChange({ name: e.target.value })} placeholder="Ex.: Supino inclinado" />
            </div>
            <div>
              <label className="label" htmlFor="e-alt">Variações (separadas por vírgula)</label>
              <input id="e-alt" className="input" value={draft.altText}
                onChange={e => onChange({ altText: e.target.value })} placeholder="Agachamento, Hack" />
              <p className="text-[11px] text-faint mt-1">Duas ou mais variações permitem escolher qual foi realizada.</p>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="label" htmlFor="e-sets">Séries</label>
                <input id="e-sets" type="number" min="1" max="12" className="input input-num" value={draft.sets}
                  onChange={e => onChange({ sets: clamp(parseInt(e.target.value) || 1, 1, 12) })} />
              </div>
              <div>
                <label className="label" htmlFor="e-reps">Repetições</label>
                <input id="e-reps" className="input" value={draft.reps}
                  onChange={e => onChange({ reps: e.target.value })} placeholder="8-12" />
              </div>
            </div>
            <div>
              <label className="label" htmlFor="e-obs">Observação</label>
              <input id="e-obs" className="input" value={draft.obs}
                onChange={e => onChange({ obs: e.target.value })} placeholder="Opcional" />
            </div>
            <div>
              <label className="label" htmlFor="e-video">Link ou termo de busca no YouTube</label>
              <input id="e-video" className="input" value={draft.videoLink}
                onChange={e => onChange({ videoLink: e.target.value })} placeholder="https://... ou termo de busca" />
            </div>
          </div>
        )}
      </Modal>
    );

    const SAMPLE_WORKOUT_JSON_STR = JSON.stringify({
      "segunda": {
        "name": "Upper Push",
        "focus": "Peito • Ombro • Tríceps",
        "exercises": [
          { "name": "Supino Inclinado", "sets": 3, "reps": "8-12", "obs": "Progressão de carga" },
          { "name": "Desenvolvimento com Halteres", "sets": 3, "reps": "8-12", "obs": "" }
        ]
      },
      "terca": {
        "name": "Pull",
        "focus": "Costas • Bíceps",
        "exercises": [
          { "name": "Puxada Alta", "sets": 3, "reps": "8-12", "obs": "" },
          { "name": "Rosca Martelo", "sets": 3, "reps": "10-12", "obs": "" }
        ]
      }
    }, null, 2);

    const JsonImporterModal = ({ open, onClose }) => {
      const app = useApp();
      const [jsonText, setJsonText] = useState('');
      const [mode, setMode] = useState('text');
      const fileInputRef = useRef(null);

      const copySample = () => {
        try {
          navigator.clipboard.writeText(SAMPLE_WORKOUT_JSON_STR);
          app.showToast('Modelo JSON copiado!', 'success');
        } catch (err) {
          app.showToast('Não foi possível copiar automaticamente.', 'error');
        }
      };

      const handleImportText = () => {
        if (!jsonText.trim()) {
          app.showToast('Cole o código JSON ou escolha um arquivo.', 'error');
          return;
        }
        let parsed;
        try { parsed = JSON.parse(jsonText); }
        catch (e) { app.showToast('JSON inválido. Verifique o formato.', 'error'); return; }
        const ok = app.importWorkoutData(parsed.workoutData || parsed);
        if (ok) {
          setJsonText('');
          onClose();
        }
      };

      const handleFileChange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(String(ev.target.result || ''));
            const ok = app.importWorkoutData(parsed.workoutData || parsed);
            if (ok) onClose();
          } catch (err) {
            app.showToast('Não foi possível ler o arquivo JSON.', 'error');
          }
        };
        reader.readAsText(file);
      };

      return (
        <Modal open={open} title="Importar / Exportar Ficha JSON" eyebrow="Ficha de Treino" onClose={onClose} hideCancel confirmLabel="Fechar">
          <div className="space-y-4">
            <div className="flex gap-2">
              <button className={`chip flex-1 ${mode === 'text' ? 'chip-on' : ''}`} onClick={() => setMode('text')}>Colar Texto JSON</button>
              <button className={`chip flex-1 ${mode === 'file' ? 'chip-on' : ''}`} onClick={() => setMode('file')}>Enviar Arquivo .json</button>
            </div>

            {mode === 'text' ? (
              <div>
                <label className="label">Código JSON da Ficha</label>
                <textarea className="input mono text-xs" style={{ minHeight: 140 }} value={jsonText}
                  onChange={e => setJsonText(e.target.value)} placeholder="Cole aqui o JSON contendo os treinos e exercícios..." />
                <button className="btn btn-primary w-full mt-2" onClick={handleImportText}>
                  <Icon name="check" size={16} /> Subir Ficha do Texto
                </button>
              </div>
            ) : (
              <div className="text-center p-4 border border-dashed hairline rounded-lg">
                <p className="text-xs text-faint mb-3">Selecione um arquivo .json de treino</p>
                <button className="btn btn-primary" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
                  <Icon name="upload" size={16} /> Escolher arquivo JSON
                </button>
                <input ref={fileInputRef} type="file" accept="application/json,.json" className="sr-only" onChange={handleFileChange} />
              </div>
            )}

            <div className="divider" />

            <div className="space-y-2">
              <button className="btn btn-dark w-full btn-sm" onClick={app.exportWorkoutJson}>
                <Icon name="download" size={14} /> Exportar Ficha Atual em JSON
              </button>
              <button className="btn btn-ghost w-full btn-sm" onClick={copySample}>
                <Icon name="copy" size={14} /> Copiar Modelo JSON de Exemplo
              </button>
            </div>
          </div>
        </Modal>
      );
    };

    const WorkoutEditor = () => {
      const app = useApp();
      const [day, setDay] = useState(app.activeDay);
      const [draft, setDraft] = useState(null);
      const [showDay, setShowDay] = useState(false);
      const [showJsonModal, setShowJsonModal] = useState(false);
      const workout = app.workoutData[day];

      const openEditor = (index) => {
        const base = index == null ? emptyExercise : workout.exercises[index];
        setDraft({
          index,
          name: base.name,
          altText: (base.alternatives || []).join(', '),
          sets: base.sets,
          reps: base.reps,
          obs: base.obs || '',
          videoLink: base.videoLink || ''
        });
      };

      const save = () => {
        if (!draft) return;
        const alts = draft.altText.split(',').map(s => s.trim()).filter(Boolean);
        const data = {
          name: draft.name.trim() || 'Exercício',
          alternatives: alts.length > 1 ? alts : [],
          sets: clamp(parseInt(draft.sets) || 1, 1, 12),
          reps: draft.reps.trim(),
          obs: draft.obs.trim(),
          videoLink: draft.videoLink.trim()
        };
        app.saveExercise(day, draft.index, data);
        setDraft(null);
      };

      return (
        <div className="a-fade">
          <ScreenHeader eyebrow="Configurações" title="Editor de treino" onBack={() => app.setView('settings')} />

          <div className="mb-4">
            <WorkoutTabs days={DAYS} active={day} onSelect={setDay} progressByDay={app.progressByDay} today={todayDayKey()} />
          </div>

          <section className="card p-4 mb-3">
            <div className="flex items-start justify-between gap-3">
              <div className="min-w-0">
                <Eyebrow red>{DAY_FULL[day]}</Eyebrow>
                <h2 className="display text-3xl text-white mt-1">{workout.name}</h2>
                <p className="text-xs text-faint mt-1">{workout.focus}</p>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={() => setShowDay(v => !v)} aria-expanded={showDay}>
                <Icon name="edit" size={14} /> Editar dia
              </button>
            </div>
            {showDay && (
              <div className="mt-4 space-y-3 a-fade">
                <div>
                  <label className="label" htmlFor="d-name">Nome do treino</label>
                  <input id="d-name" className="input" value={workout.name}
                    onChange={e => app.updateDayMeta(day, { name: e.target.value })} />
                </div>
                <div>
                  <label className="label" htmlFor="d-focus">Grupos musculares</label>
                  <input id="d-focus" className="input" value={workout.focus}
                    onChange={e => app.updateDayMeta(day, { focus: e.target.value })} />
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="label" htmlFor="d-cardio">Cardio (duração)</label>
                    <input id="d-cardio" className="input" value={workout.cardio.duration}
                      onChange={e => app.updateCardio(day, { duration: e.target.value })} />
                  </div>
                  <div>
                    <label className="label" htmlFor="d-cnote">Cardio (observação)</label>
                    <input id="d-cnote" className="input" value={workout.cardio.note || ''}
                      onChange={e => app.updateCardio(day, { note: e.target.value })} placeholder="Ex.: Intensidade leve" />
                  </div>
                </div>
                <div>
                  <label className="label" htmlFor="d-copts">Modalidades sugeridas (vírgula)</label>
                  <input id="d-copts" className="input" value={(workout.cardio.options || []).join(', ')}
                    onChange={e => app.updateCardio(day, { options: e.target.value.split(',').map(s => s.trim()).filter(Boolean) })}
                    placeholder="Caminhada inclinada, Bike" />
                </div>
              </div>
            )}
          </section>

          <div className="space-y-2.5">
            {workout.exercises.map((ex, idx) => (
              <div key={idx} className="card p-4">
                <div className="flex items-start gap-3">
                  <span className="display text-2xl text-faint leading-none pt-0.5">{pad(idx + 1)}</span>
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-white text-[15px] break-words">{displayName(ex)}</p>
                    <p className="text-xs text-faint mt-0.5">{ex.sets} × {ex.reps || 'livre'}{ex.obs ? ` · ${ex.obs}` : ''}</p>
                  </div>
                  <div className="flex flex-col gap-1">
                    <button className="btn btn-ghost btn-icon" style={{ minHeight: 32, minWidth: 32 }} onClick={() => app.moveExercise(day, idx, -1)}
                      disabled={idx === 0} aria-label={`Mover ${displayName(ex)} para cima`}><Icon name="arrowUp" size={14} /></button>
                    <button className="btn btn-ghost btn-icon" style={{ minHeight: 32, minWidth: 32 }} onClick={() => app.moveExercise(day, idx, 1)}
                      disabled={idx === workout.exercises.length - 1} aria-label={`Mover ${displayName(ex)} para baixo`}><Icon name="arrowDown" size={14} /></button>
                  </div>
                </div>
                <div className="flex gap-2 mt-3">
                  <button className="btn btn-dark btn-sm flex-1" onClick={() => openEditor(idx)}><Icon name="edit" size={14} /> Editar</button>
                  <button className="btn btn-danger btn-sm flex-1" onClick={() => app.confirmDeleteExercise(day, idx)}><Icon name="trash" size={14} /> Excluir</button>
                </div>
              </div>
            ))}
          </div>

          <button className="btn btn-primary w-full mt-3" onClick={() => openEditor(null)}>
            <Icon name="plus" size={16} /> Adicionar exercício
          </button>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-3">
            <button className="btn btn-dark w-full" onClick={() => setShowJsonModal(true)}>
              <Icon name="upload" size={15} /> Importar / Exportar JSON
            </button>
            <button className="btn btn-ghost w-full" onClick={app.confirmRestoreDefaults}>
              <Icon name="refresh" size={15} /> Restaurar padrão
            </button>
          </div>

          <ExerciseEditorModal open={!!draft} draft={draft}
            onChange={(patch) => setDraft(d => ({ ...d, ...patch }))}
            onClose={() => setDraft(null)} onSave={save} />
          <JsonImporterModal open={showJsonModal} onClose={() => setShowJsonModal(false)} />
          <div className="h-6" />
        </div>
      );
    };

    /* ============================================================
       22. APP
       ============================================================ */
    function App() {
      /* ---------- Estado persistido (inicialização preguiçosa + migração) ---------- */
      const [workoutData, setWorkoutData] = useState(() => migrateWorkout(storage.get(KEYS.workout, null)));
      const [settings, setSettings] = useState(() => migrateSettings(storage.get(KEYS.settings, null)));
      const [progress, setProgress] = useState(() => {
        const p = migrateProgress(storage.get(KEYS.progress, null));
        const week = currentWeekId();
        return p.weekId === week ? p : { version: 2, weekId: week, sets: {}, setWeights: {}, variants: {} };
      });
      const [weights, setWeights] = useState(() => migrateWeights(storage.get(KEYS.weights, null)));
      const [history, setHistory] = useState(() => migrateHistory(storage.get(KEYS.history, null)));
      const [userStats, setUserStats] = useState(() => migrateStats(storage.get(KEYS.stats, null)));
      const [session, setSession] = useState(() => migrateSession(storage.get(KEYS.session, null)));
      const [cardio, setCardio] = useState(() => migrateCardio(storage.get(KEYS.cardio, null)));

      /* ---------- Estado de UI ---------- */
      const [view, setView] = useState('workout');
      const [activeDay, setActiveDay] = useState(() => {
        const s = migrateSession(storage.get(KEYS.session, null));
        return s && DAYS.includes(s.day) ? s.day : todayDayKey();
      });
      const [cardioModality, setCardioModality] = useState(() => {
        const c = migrateCardio(storage.get(KEYS.cardio, null));
        return c ? c.modality : 'Bike';
      });
      const [modal, setModal] = useState({ open: false });
      const [toast, setToast] = useState({ open: false, message: '', type: 'info' });
      const [summary, setSummary] = useState(null);
      const [now, setNow] = useState(Date.now());
      const [rest, setRest] = useState(() => ({ status: 'idle', remaining: migrateSettings(storage.get(KEYS.settings, null)).restSeconds, endAt: 0 }));
      const toastTimer = useRef(null);
      const restDoneTimer = useRef(null);

      /* ---------- Persistência ---------- */
      useEffect(() => { storage.set(KEYS.workout, workoutData); }, [workoutData]);
      useEffect(() => { storage.set(KEYS.settings, settings); }, [settings]);
      useEffect(() => { storage.set(KEYS.progress, progress); }, [progress]);
      useEffect(() => { storage.set(KEYS.weights, weights); }, [weights]);
      useEffect(() => { storage.set(KEYS.history, history); }, [history]);
      useEffect(() => { storage.set(KEYS.stats, userStats); }, [userStats]);
      useEffect(() => {
        if (session) storage.set(KEYS.session, session); else storage.remove(KEYS.session);
      }, [session]);
      useEffect(() => {
        if (cardio) storage.set(KEYS.cardio, cardio); else storage.remove(KEYS.cardio);
      }, [cardio]);
      useEffect(() => {
        document.body.classList.toggle('reduce-motion', !!settings.reduceMotion);
      }, [settings.reduceMotion]);

      /* ---------- Relógio das sessões ---------- */
      const clockOn = !!session || !!cardio;
      useEffect(() => {
        if (!clockOn) return;
        setNow(Date.now());
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, [clockOn]);
      const elapsed = session ? Math.max(0, now - session.startedAt) : 0;
      const cardioElapsed = cardio ? Math.max(0, now - cardio.startedAt) : 0;

      /* ---------- Avisos ---------- */
      const showToast = useCallback((message, type = 'info') => {
        setToast({ open: true, message, type });
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(t => ({ ...t, open: false })), 3200);
      }, []);
      const closeToast = useCallback(() => setToast(t => ({ ...t, open: false })), []);
      const closeModal = useCallback(() => setModal(m => ({ ...m, open: false })), []);
      useEffect(() => () => {
        if (toastTimer.current) clearTimeout(toastTimer.current);
        if (restDoneTimer.current) clearTimeout(restDoneTimer.current);
      }, []);

      /* ---------- Timer de descanso ---------- */
      const finishRest = useCallback(() => {
        setRest({ status: 'done', remaining: 0, endAt: 0 });
        if (settings.vibrate) vibrate([220, 110, 220]);
        if (settings.notify) notify('Descanso finalizado', 'Hora de voltar para a série.');
        showToast('DESCANSO FINALIZADO', 'error');
        if (restDoneTimer.current) clearTimeout(restDoneTimer.current);
        restDoneTimer.current = setTimeout(() => {
          setRest(r => (r.status === 'done' ? { status: 'idle', remaining: settings.restSeconds, endAt: 0 } : r));
        }, 6000);
      }, [settings.vibrate, settings.notify, settings.restSeconds, showToast]);

      useEffect(() => {
        if (rest.status !== 'running') return;
        const tick = () => {
          const left = Math.ceil((rest.endAt - Date.now()) / 1000);
          if (left <= 0) finishRest();
          else setRest(r => (r.status === 'running' && r.remaining !== left ? { ...r, remaining: left } : r));
        };
        tick();
        const id = setInterval(tick, 250);
        return () => clearInterval(id);
      }, [rest.status, rest.endAt, finishRest]);

      useEffect(() => {
        setRest(r => (r.status === 'idle' ? { ...r, remaining: settings.restSeconds } : r));
      }, [settings.restSeconds]);

      const startRest = useCallback(() => {
        if (restDoneTimer.current) clearTimeout(restDoneTimer.current);
        setRest({ status: 'running', remaining: settings.restSeconds, endAt: Date.now() + settings.restSeconds * 1000 });
      }, [settings.restSeconds]);
      const pauseRest = useCallback(() => setRest(r => ({ status: 'paused', remaining: r.remaining, endAt: 0 })), []);
      const resumeRest = useCallback(() => setRest(r => ({ status: 'running', remaining: r.remaining, endAt: Date.now() + r.remaining * 1000 })), []);
      const resetRest = useCallback(() => {
        if (restDoneTimer.current) clearTimeout(restDoneTimer.current);
        setRest({ status: 'idle', remaining: settings.restSeconds, endAt: 0 });
      }, [settings.restSeconds]);
      const extendRest = useCallback(() => {
        setRest(r => {
          if (r.status === 'running') return { ...r, remaining: r.remaining + 15, endAt: r.endAt + 15000 };
          if (r.status === 'paused') return { ...r, remaining: r.remaining + 15 };
          return { status: 'idle', remaining: r.remaining + 15, endAt: 0 };
        });
      }, []);

      /* ---------- Derivados do treino ---------- */
      const getSets = useCallback((day, idx, ex) => {
        const base = weights[exKey(day, idx)] || '';
        return Array.from({ length: ex.sets }).map((_, i) => {
          const k = setKey(day, idx, i);
          const raw = progress.setWeights[k] || '';
          return { done: !!progress.sets[k], rawWeight: raw, weight: raw || base };
        });
      }, [progress, weights]);

      const dayStats = useCallback((day) => {
        const w = workoutData[day];
        let setsDone = 0, setsTotal = 0, exDone = 0;
        w.exercises.forEach((ex, idx) => {
          let d = 0;
          for (let i = 0; i < ex.sets; i++) if (progress.sets[setKey(day, idx, i)]) d++;
          setsDone += d; setsTotal += ex.sets;
          if (ex.sets > 0 && d === ex.sets) exDone++;
        });
        const exTotal = w.exercises.length;
        return { exDone, exTotal, setsDone, setsTotal, pct: exTotal ? (exDone / exTotal) * 100 : 0 };
      }, [workoutData, progress]);

      const progressByDay = useMemo(() => {
        const out = {};
        DAYS.forEach(d => { const s = dayStats(d); out[d] = { done: s.exDone, total: s.exTotal }; });
        return out;
      }, [dayStats]);

      /** Cargas por exercício a partir do histórico */
      const loadIndex = useMemo(() => {
        const idx = {};
        history.filter(e => e.type !== 'cardio').forEach(e => {
          (e.exercises || []).forEach(ex => {
            const key = String(ex.name || '').toLowerCase().trim();
            if (!key) return;
            const best = Math.max(0, ...ex.sets.filter(s => s.completed).map(s => num(s.weight)));
            if (!best) return;
            if (!idx[key]) idx[key] = { last: 0, lastDate: 0, best: 0 };
            if (e.date >= idx[key].lastDate) { idx[key].last = best; idx[key].lastDate = e.date; }
            if (best > idx[key].best) idx[key].best = best;
          });
        });
        return idx;
      }, [history]);

      const loadInfoFor = useCallback((ex, variant) => {
        const candidates = [variant, displayName(ex), ex.name].filter(Boolean);
        for (const c of candidates) {
          const hit = loadIndex[String(c).toLowerCase().trim()];
          if (hit) return { last: hit.last, best: hit.best };
        }
        return { last: 0, best: 0 };
      }, [loadIndex]);

      /* ---------- Ações de treino ---------- */
      const setWeightAction = useCallback((day, idx, value) => {
        const key = exKey(day, idx);
        setWeights(prev => {
          const next = { ...prev };
          if (value === '' || value == null) delete next[key]; else next[key] = String(value);
          return next;
        });
      }, []);

      const setSetWeight = useCallback((day, idx, setIdx, value) => {
        const key = setKey(day, idx, setIdx);
        setProgress(p => {
          const setWeights = { ...p.setWeights };
          if (value === '' || value == null) delete setWeights[key]; else setWeights[key] = String(value);
          return { ...p, setWeights };
        });
      }, []);

      const setVariant = useCallback((day, idx, value) => {
        const key = exKey(day, idx);
        setProgress(p => {
          const variants = { ...p.variants };
          if (!value) delete variants[key]; else variants[key] = value;
          return { ...p, variants };
        });
      }, []);

      const toggleSet = useCallback((day, idx, setIdx, ex) => {
        const key = setKey(day, idx, setIdx);
        const wasDone = !!progress.sets[key];
        setProgress(p => {
          const sets = { ...p.sets };
          const setWeights = { ...p.setWeights };
          if (wasDone) { delete sets[key]; }
          else {
            sets[key] = true;
            if (!setWeights[key]) {
              const base = weights[exKey(day, idx)];
              if (base) setWeights[key] = String(base);
            }
          }
          return { ...p, sets, setWeights };
        });

        if (wasDone) return;
        if (settings.vibrate) vibrate(20);
        let done = 1;
        for (let i = 0; i < ex.sets; i++) if (i !== setIdx && progress.sets[setKey(day, idx, i)]) done++;
        if (done >= ex.sets) {
          showToast(`${displayName(ex).toUpperCase()} CONCLUÍDO`, 'success');
          if (settings.vibrate) vibrate([40, 60, 90]);
        } else if (settings.autoStartRest) {
          startRest();
        }
      }, [progress, weights, settings.autoStartRest, settings.vibrate, showToast, startRest]);

      const startWorkout = useCallback((day) => {
        setSession({ startedAt: Date.now(), day });
        setNow(Date.now());
        if (settings.notify && 'Notification' in window && Notification.permission === 'default') {
          try { Notification.requestPermission(); } catch (e) { }
        }
        showToast('Treino iniciado. Bom treino!', 'success');
      }, [settings.notify, showToast]);

      const buildSummary = useCallback((day) => {
        const w = workoutData[day];
        const exercises = [];
        let completedEx = 0, totalSets = 0, volume = 0;
        w.exercises.forEach((ex, idx) => {
          const variant = progress.variants[exKey(day, idx)] || '';
          const base = weights[exKey(day, idx)] || '';
          const sets = Array.from({ length: ex.sets }).map((_, i) => {
            const k = setKey(day, idx, i);
            const completed = !!progress.sets[k];
            const weight = progress.setWeights[k] || base || '';
            if (completed) { totalSets++; volume += num(weight) * repsMid(ex.reps); }
            return { completed, weight: completed ? String(weight) : '', reps: ex.reps };
          });
          const doneCount = sets.filter(s => s.completed).length;
          if (doneCount === ex.sets && ex.sets > 0) completedEx++;
          if (doneCount > 0) exercises.push({ name: variant || displayName(ex), reps: ex.reps, sets });
        });
        const duration = session ? Date.now() - session.startedAt : 0;
        return {
          version: 2, id: uid(), date: Date.now(), weekId: currentWeekId(), type: 'strength',
          day, dayName: w.name, duration,
          exercisesCompleted: completedEx, totalExercises: w.exercises.length,
          totalSets, volume: Math.round(volume), exercises,
          pct: w.exercises.length ? (completedEx / w.exercises.length) * 100 : 0
        };
      }, [workoutData, progress, weights, session]);

      const requestFinish = useCallback(() => {
        if (!session) { showToast('Inicie o treino antes de finalizar.', 'error'); return; }
        setSummary(buildSummary(session.day));
      }, [session, buildSummary, showToast]);

      const saveWorkout = useCallback(() => {
        if (!summary) return;
        const entry = { ...summary };
        delete entry.pct;
        setHistory(prev => [...prev, entry].sort((a, b) => a.date - b.date));
        setSession(null);
        setSummary(null);
        if (settings.vibrate) vibrate([260, 90, 260]);
        showToast('Treino salvo no histórico.', 'success');
      }, [summary, settings.vibrate, showToast]);

      /* ---------- Cardio ---------- */
      const startCardio = useCallback((day) => {
        setCardio({ startedAt: Date.now(), modality: cardioModality, day });
        setNow(Date.now());
        setView('cardio');
        showToast(`Cardio (${cardioModality}) iniciado.`, 'success');
      }, [cardioModality, showToast]);

      const requestFinishCardio = useCallback(() => {
        if (!cardio) return;
        const duration = Date.now() - cardio.startedAt;
        setModal({
          open: true, eyebrow: 'Cardio', title: 'Finalizar atividade',
          body: `Você completou ${toMin(duration)} min de ${cardio.modality}. Salvar no histórico?`,
          confirmLabel: 'Salvar', onConfirm: () => {
            setHistory(prev => [...prev, {
              version: 2, id: uid(), date: Date.now(), weekId: currentWeekId(), type: 'cardio',
              day: cardio.day || null, dayName: cardio.modality, modality: cardio.modality,
              duration, exercisesCompleted: 0, totalExercises: 0, totalSets: 0, volume: 0, exercises: []
            }].sort((a, b) => a.date - b.date));
            setCardio(null);
            setView('workout');
            showToast('Cardio salvo no histórico.', 'success');
          }
        });
      }, [cardio, showToast]);

      const cancelCardio = useCallback(() => {
        setModal({
          open: true, eyebrow: 'Cardio', title: 'Descartar atividade',
          body: 'O tempo registrado será perdido e nada será salvo no histórico.',
          confirmLabel: 'Descartar', danger: true,
          onConfirm: () => { setCardio(null); setView('workout'); showToast('Atividade descartada.', 'info'); }
        });
      }, [showToast]);

      /* ---------- Semana / histórico ---------- */
      const confirmResetWeek = useCallback(() => {
        setModal({
          open: true, eyebrow: weekLabel(progress.weekId), title: 'Resetar semana',
          body: 'Todas as séries marcadas nesta semana serão desmarcadas. Histórico, cargas, plano e configurações permanecem intactos.',
          confirmLabel: 'Resetar', danger: true,
          onConfirm: () => {
            setProgress({ version: 2, weekId: currentWeekId(), sets: {}, setWeights: {}, variants: {} });
            showToast('Progresso da semana zerado.', 'info');
          }
        });
      }, [progress.weekId, showToast]);

      const confirmDeleteHistory = useCallback((entry) => {
        setModal({
          open: true, eyebrow: fmtDate(entry.date), title: 'Excluir registro',
          body: 'Este treino será removido do histórico permanentemente. As estatísticas serão recalculadas.',
          confirmLabel: 'Excluir', danger: true,
          onConfirm: () => {
            setHistory(prev => prev.filter(e => e.id !== entry.id));
            showToast('Registro excluído.', 'info');
          }
        });
      }, [showToast]);

      /* ---------- Editor ---------- */
      const remapKeys = useCallback((obj, day, mapIndex) => {
        const out = {};
        Object.keys(obj).forEach(k => {
          const parts = k.split('-');
          if (parts[0] !== day) { out[k] = obj[k]; return; }
          const nextIdx = mapIndex(parseInt(parts[1]));
          if (nextIdx == null) return;
          parts[1] = String(nextIdx);
          out[parts.join('-')] = obj[k];
        });
        return out;
      }, []);

      const applyIndexMap = useCallback((day, mapIndex) => {
        setProgress(p => ({
          ...p,
          sets: remapKeys(p.sets, day, mapIndex),
          setWeights: remapKeys(p.setWeights, day, mapIndex),
          variants: remapKeys(p.variants, day, mapIndex)
        }));
        setWeights(prev => remapKeys(prev, day, mapIndex));
      }, [remapKeys]);

      const saveExercise = useCallback((day, index, data) => {
        setWorkoutData(prev => {
          const next = deepCopy(prev);
          if (index == null) next[day].exercises.push(data);
          else next[day].exercises[index] = data;
          return next;
        });
        showToast(index == null ? 'Exercício adicionado.' : 'Exercício atualizado.', 'success');
      }, [showToast]);

      const confirmDeleteExercise = useCallback((day, index) => {
        const ex = workoutData[day].exercises[index];
        setModal({
          open: true, eyebrow: 'Editor', title: 'Excluir exercício',
          body: `"${displayName(ex)}" será removido de ${DAY_FULL[day]}. As séries e cargas registradas para ele nesta semana também serão apagadas.`,
          confirmLabel: 'Excluir', danger: true,
          onConfirm: () => {
            setWorkoutData(prev => {
              const next = deepCopy(prev);
              next[day].exercises.splice(index, 1);
              return next;
            });
            applyIndexMap(day, (i) => (i === index ? null : i > index ? i - 1 : i));
            showToast('Exercício excluído.', 'info');
          }
        });
      }, [workoutData, applyIndexMap, showToast]);

      const moveExercise = useCallback((day, index, dir) => {
        const target = index + dir;
        const list = workoutData[day].exercises;
        if (target < 0 || target >= list.length) return;
        setWorkoutData(prev => {
          const next = deepCopy(prev);
          const arr = next[day].exercises;
          const [item] = arr.splice(index, 1);
          arr.splice(target, 0, item);
          return next;
        });
        applyIndexMap(day, (i) => (i === index ? target : i === target ? index : i));
      }, [workoutData, applyIndexMap]);

      const updateDayMeta = useCallback((day, patch) => {
        setWorkoutData(prev => {
          const next = deepCopy(prev);
          Object.assign(next[day], patch);
          return next;
        });
      }, []);

      const updateCardio = useCallback((day, patch) => {
        setWorkoutData(prev => {
          const next = deepCopy(prev);
          next[day].cardio = { ...next[day].cardio, ...patch };
          return next;
        });
      }, []);

      const confirmRestoreDefaults = useCallback(() => {
        setModal({
          open: true, eyebrow: 'Editor', title: 'Restaurar plano padrão',
          body: 'Os exercícios voltam exatamente ao plano original (segunda a sexta). Histórico, cargas e dados pessoais não são afetados.',
          confirmLabel: 'Restaurar', danger: true,
          onConfirm: () => { setWorkoutData(deepCopy(defaultWorkoutData)); showToast('Plano padrão restaurado.', 'success'); }
        });
      }, [showToast]);

      /* ---------- Perfil ---------- */
      const updateStat = useCallback((key, value) => {
        setUserStats(prev => ({ ...prev, [key]: value }));
      }, []);

      const logBodyWeight = useCallback((value) => {
        const w = num(value);
        if (!w) return;
        setUserStats(prev => {
          const today = dayStamp(Date.now());
          const log = (prev.weightLog || []).filter(e => e.date !== today);
          log.push({ date: today, weight: w });
          log.sort((a, b) => (a.date < b.date ? -1 : 1));
          return { ...prev, startWeight: prev.startWeight || String(w), weightLog: log.slice(-400) };
        });
      }, []);

      const setWaterCups = useCallback((cups) => {
        setUserStats(prev => ({ ...prev, water: { date: dayStamp(Date.now()), cups: Math.max(0, cups) } }));
      }, []);

      const updateSetting = useCallback((key, value) => {
        setSettings(prev => ({ ...prev, [key]: value }));
      }, []);

      const notifySupported = typeof window !== 'undefined' && 'Notification' in window;
      const notifyPermission = notifySupported ? Notification.permission : 'unsupported';
      const notifyStatus = !notifySupported ? 'Não suportado neste navegador'
        : notifyPermission === 'granted' ? 'Permissão concedida'
          : notifyPermission === 'denied' ? 'Bloqueado nas configurações do navegador'
            : 'Permissão ainda não concedida';
      const requestNotify = useCallback(() => {
        if (!notifySupported) return;
        try {
          Notification.requestPermission().then(r => {
            showToast(r === 'granted' ? 'Notificações liberadas.' : 'Permissão não concedida.', r === 'granted' ? 'success' : 'info');
          });
        } catch (e) { }
      }, [notifySupported, showToast]);

      /* ---------- Backup ---------- */
      const exportBackup = useCallback(() => {
        try {
          const payload = {
            version: 2,
            app: 'IRON TRACK',
            exportedAt: new Date().toISOString(),
            workoutData, settings, progress, weights, history, userStats
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `irontrack-backup-${dayStamp(Date.now())}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('Backup exportado.', 'success');
        } catch (err) {
          showToast('Não foi possível gerar o backup.', 'error');
        }
      }, [workoutData, settings, progress, weights, history, userStats, showToast]);

      /** Lê backups v2 e também o formato antigo (valores em texto JSON). */
      const parseBackup = useCallback((text) => {
        let data;
        try { data = JSON.parse(text); }
        catch (e) { return { ok: false, error: 'O arquivo não é um JSON válido.' }; }
        if (!data || typeof data !== 'object') return { ok: false, error: 'Conteúdo do arquivo não reconhecido.' };

        const reparse = (v) => {
          if (typeof v !== 'string') return v;
          try { return JSON.parse(v); } catch (e) { return null; }
        };

        let payload;
        if (data.version === 2 || data.workoutData || data.userStats) {
          payload = {
            workoutData: migrateWorkout(data.workoutData),
            settings: migrateSettings(data.settings),
            progress: migrateProgress(data.progress),
            weights: migrateWeights(data.weights),
            history: migrateHistory(data.history),
            userStats: migrateStats(data.userStats)
          };
        } else if (data.progress !== undefined || data.history !== undefined || data.weights !== undefined || data.stats !== undefined) {
          payload = {
            workoutData: migrateWorkout(reparse(data.workout) || null),
            settings: migrateSettings(reparse(data.timer) || null),
            progress: migrateProgress(reparse(data.progress)),
            weights: migrateWeights(reparse(data.weights)),
            history: migrateHistory(reparse(data.history)),
            userStats: migrateStats(reparse(data.stats))
          };
        } else if (data.segunda || data.terca || data.quarta || data.quinta || data.sexta) {
          payload = {
            workoutData: migrateWorkout(data),
            settings: migrateSettings(null),
            progress: migrateProgress(null),
            weights: migrateWeights(null),
            history: migrateHistory(null),
            userStats: migrateStats(null)
          };
        } else {
          return { ok: false, error: 'Nenhum dado do IRON TRACK foi encontrado no arquivo.' };
        }

        const setsCount = Object.keys(payload.progress.sets).length;
        return {
          ok: true,
          payload,
          version: data.version === 2 ? 2 : 1,
          exportedAt: data.exportedAt || null,
          summary: [
            `${payload.history.length} sessões no histórico`,
            `${DAYS.filter(d => payload.workoutData[d]).length} dias de treino`,
            `${Object.keys(payload.weights).length} cargas registradas`,
            `${setsCount} séries marcadas na semana`,
            payload.userStats.weight ? `peso ${payload.userStats.weight} kg` : 'sem peso informado'
          ]
        };
      }, []);

      const importBackup = useCallback((event) => {
        const input = event.target;
        const file = input.files && input.files[0];
        input.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onerror = () => showToast('Não foi possível ler o arquivo.', 'error');
        reader.onload = (e) => {
          const result = parseBackup(String(e.target.result || ''));
          if (!result.ok) {
            setModal({ open: true, eyebrow: 'Importar', title: 'Backup inválido', body: result.error, hideCancel: true, cancelLabel: 'Fechar' });
            return;
          }
          setModal({
            open: true,
            eyebrow: `Backup v${result.version}`,
            title: 'Restaurar dados',
            node: (
              <div>
                <p className="mb-3">Todos os dados atuais deste dispositivo serão substituídos por:</p>
                <ul className="space-y-1.5 mb-3">
                  {result.summary.map((s, i) => (
                    <li key={i} className="flex gap-2 text-white text-sm">
                      <span className="text-brand mt-0.5"><Icon name="check" size={13} strokeWidth={3} /></span>{s}
                    </li>
                  ))}
                </ul>
                {result.exportedAt ? <p className="text-xs text-faint">Exportado em {new Date(result.exportedAt).toLocaleString('pt-BR')}</p> : null}
              </div>
            ),
            confirmLabel: 'Restaurar',
            danger: true,
            onConfirm: () => {
              const p = result.payload;
              storage.set(KEYS.workout, p.workoutData);
              storage.set(KEYS.settings, p.settings);
              storage.set(KEYS.progress, p.progress);
              storage.set(KEYS.weights, p.weights);
              storage.set(KEYS.history, p.history);
              storage.set(KEYS.stats, p.userStats);
              storage.remove(KEYS.session);
              storage.remove(KEYS.cardio);
              showToast('Dados restaurados. Recarregando...', 'success');
              setTimeout(() => window.location.reload(), 1200);
            }
          });
        };
        reader.readAsText(file);
      }, [parseBackup, showToast]);

      const importWorkoutData = useCallback((raw) => {
        const migrated = migrateWorkout(raw);
        if (!migrated) {
          showToast('Formato de treino inválido.', 'error');
          return false;
        }
        setWorkoutData(migrated);
        storage.set(KEYS.workout, migrated);
        showToast('Ficha de treino atualizada!', 'success');
        return true;
      }, [showToast]);

      const exportWorkoutJson = useCallback(() => {
        const jsonStr = JSON.stringify(workoutData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ficha_treino_${dayStamp(Date.now())}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Ficha exportada em JSON!', 'success');
      }, [workoutData, showToast]);

      /* ---------- Navegação ---------- */
      const navigate = useCallback((next) => {
        setView(next);
        if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'auto' });
      }, []);

      /* ---------- Contexto ---------- */
      const ctx = {
        workoutData, settings, progress, weights, history, userStats, session, cardio,
        activeDay, view, elapsed, cardioElapsed, cardioModality, rest,
        setView: navigate, setActiveDay, setCardioModality,
        getSets, dayStats, progressByDay, loadInfoFor,
        toggleSet, setSetWeight, setWeight: setWeightAction, setVariant,
        startWorkout, requestFinish,
        startCardio, requestFinishCardio, cancelCardio,
        confirmResetWeek, confirmDeleteHistory, confirmRestoreDefaults, confirmDeleteExercise,
        saveExercise, moveExercise, updateDayMeta, updateCardio,
        updateStat, logBodyWeight, setWaterCups, updateSetting,
        exportBackup, importBackup, importWorkoutData, exportWorkoutJson, showToast,
        notifyStatus, canRequestNotify: notifySupported && notifyPermission === 'default', requestNotify
      };

      const showDock = view === 'workout';

      return (
        <Ctx.Provider value={ctx}>
          <SideNavigation view={view} onChange={navigate} sessionRunning={!!session} />

          <div className="lg:pl-60">
            <main className="app-main px-4 sm:px-6 mx-auto w-full max-w-2xl lg:max-w-3xl">
              {view === 'workout' && <WorkoutScreen />}
              {view === 'cardio' && <CardioScreen />}
              {view === 'history' && <HistoryScreen />}
              {view === 'stats' && <StatsDashboard />}
              {view === 'profile' && <ProfileScreen />}
              {view === 'settings' && <SettingsScreen />}
              {view === 'editor' && <WorkoutEditor />}
            </main>
          </div>

          {showDock && (
            <div className="dock-wrap px-3">
              <div className="max-w-2xl lg:max-w-3xl mx-auto">
                <RestTimer rest={rest} total={settings.restSeconds}
                  onStart={startRest} onPause={pauseRest} onResume={resumeRest}
                  onReset={resetRest} onExtend={extendRest} />
              </div>
            </div>
          )}

          <BottomNavigation view={view} onChange={navigate} sessionRunning={!!session} />

          <Modal open={!!modal.open} title={modal.title} eyebrow={modal.eyebrow}
            onClose={closeModal} onConfirm={modal.onConfirm}
            confirmLabel={modal.confirmLabel} danger={modal.danger} hideCancel={modal.hideCancel}
            cancelLabel={modal.cancelLabel || 'Cancelar'}>
            {modal.node || modal.body}
          </Modal>

          <WorkoutSummary data={summary} onSave={saveWorkout} onContinue={() => setSummary(null)} />

          <Toast toast={toast} onClose={closeToast} />
        </Ctx.Provider>
      );
    }

    /* ============================================================
       23. BOOT
       ============================================================ */
    const container = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(container).render(<App />);
    } else {
      ReactDOM.render(<App />, container);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => { });
      });
    }
  </script>
</body>

</html>
