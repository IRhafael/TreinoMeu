<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="IRON TRACK — rastreador pessoal de treino, cargas e progresso">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>IRON TRACK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#050505',
            surface: '#0B0B0B',
            surface2: '#111111',
            line: '#27272A',
            brand: { DEFAULT: '#E10600', hi: '#FF1A1A', dim: '#7A0300' },
            soft: '#A1A1AA',
            faint: '#71717A'
          },
          fontFamily: {
            display: ['"Bebas Neue"', 'Impact', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">
  <style>
    /* ==========================================================
       IRON TRACK — DESIGN SYSTEM
       Preto / Vermelho / Branco. Alto contraste. Dark only.
       ========================================================== */
    :root {
      --bg: #050505;
      --surface: #0B0B0B;
      --surface-2: #111111;
      --surface-3: #17171A;
      --line: #27272A;
      --line-soft: #1C1C1F;
      --red: #E10600;
      --red-hi: #FF1A1A;
      --red-dim: rgba(225, 6, 0, 0.12);
      --red-line: rgba(225, 6, 0, 0.35);
      --white: #FFFFFF;
      --txt-2: #A1A1AA;
      --txt-3: #71717A;
      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --nav-h: 66px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background: var(--bg);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ---------- Tipografia ---------- */
    .display {
      font-family: 'Bebas Neue', Impact, sans-serif;
      letter-spacing: 0.02em;
      line-height: 0.92;
      text-transform: uppercase;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--txt-3);
    }

    .eyebrow-red {
      color: var(--red);
    }

    /* ---------- Superfícies ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 8px 24px -18px #000;
    }

    .card-2 {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
    }

    .card-active {
      border-color: var(--red-line);
      box-shadow: 0 0 0 1px var(--red-line), 0 12px 40px -22px var(--red);
    }

    .card-done {
      border-color: #1F1F22;
      background: linear-gradient(180deg, rgba(225, 6, 0, 0.05) 0%, var(--surface) 42%);
    }

    .hairline {
      border-color: var(--line);
    }

    /* ---------- Botões ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 46px;
      padding: 0 18px;
      border-radius: var(--r-sm);
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .12s ease, color .15s ease;
      user-select: none;
    }

    .btn:active:not(:disabled) {
      transform: scale(.975);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 1;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--red-hi);
      border-color: var(--red-hi);
    }

    .btn-primary:disabled {
      background: var(--surface-2);
      color: var(--txt-3);
      border-color: var(--line);
    }

    .btn-dark {
      background: var(--surface-2);
      color: #fff;
      border-color: var(--line);
    }

    .btn-dark:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: #333338;
    }

    .btn-dark:disabled {
      color: var(--txt-3);
      background: var(--surface);
    }

    .btn-ghost {
      background: transparent;
      color: var(--txt-2);
      border-color: var(--line);
    }

    .btn-ghost:hover:not(:disabled) {
      color: #fff;
      border-color: #3A3A40;
      background: var(--surface-2);
    }

    .btn-danger {
      background: transparent;
      color: var(--red-hi);
      border-color: var(--red-line);
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--red-dim);
    }

    .btn-lg {
      min-height: 56px;
      font-size: 16px;
      border-radius: var(--r-md);
    }

    .btn-sm {
      min-height: 38px;
      font-size: 12px;
      padding: 0 12px;
    }

    .btn-icon {
      min-height: 44px;
      min-width: 44px;
      padding: 0;
      border-radius: var(--r-sm);
    }

    /* ---------- Inputs ---------- */
    .input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      color: #fff;
      padding: 11px 12px;
      font-size: 15px;
      min-height: 46px;
      transition: border-color .15s ease, background .15s ease;
    }

    .input::placeholder {
      color: #52525B;
    }

    .input:focus {
      outline: none;
      border-color: var(--red);
      background: #141416;
    }

    .input-num {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      text-align: center;
    }

    .label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--txt-3);
      margin-bottom: 6px;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type="number"] {
      appearance: textfield;
      -moz-appearance: textfield;
    }

    select.input {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2371717A' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 36px;
    }

    /* ---------- Badges / chips ---------- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: 1px solid var(--line);
      color: var(--txt-2);
      background: var(--surface-2);
      white-space: nowrap;
    }

    .badge-red {
      color: #fff;
      background: var(--red);
      border-color: var(--red);
    }

    .badge-outline-red {
      color: var(--red-hi);
      background: var(--red-dim);
      border-color: var(--red-line);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--txt-2);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s ease;
    }

    .chip:hover:not(:disabled) {
      border-color: #3A3A40;
      color: #fff;
    }

    .chip-on {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .chip-on:hover {
      background: var(--red-hi);
      color: #fff;
    }

    .chip:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* ---------- Barras de progresso ---------- */
    .bar {
      height: 8px;
      width: 100%;
      background: var(--surface-3);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--line-soft);
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--red) 0%, var(--red-hi) 100%);
      border-radius: 99px;
      transition: width .45s cubic-bezier(.4, 0, .2, 1);
    }

    .bar-thin {
      height: 5px;
    }

    .bar-thick {
      height: 12px;
    }

    .bar-white .bar-fill {
      background: #fff;
    }

    /* ---------- Navegação ---------- */
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex: 1;
      min-height: 56px;
      color: var(--txt-3);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      transition: color .15s ease;
    }

    .nav-item:hover {
      color: var(--txt-2);
    }

    .nav-item.on {
      color: #fff;
    }

    .nav-item.on::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 3px;
      background: var(--red);
      border-radius: 0 0 3px 3px;
    }

    .nav-side {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--r-sm);
      color: var(--txt-2);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .15s ease;
    }

    .nav-side:hover {
      background: var(--surface-2);
      color: #fff;
    }

    .nav-side.on {
      background: var(--red-dim);
      border-color: var(--red-line);
      color: #fff;
    }

    /* ---------- Tabs de dia ---------- */
    .daytab {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 9px 0 8px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--txt-3);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .1em;
      cursor: pointer;
      min-height: 52px;
      transition: all .18s ease;
    }

    .daytab:hover {
      color: #fff;
      border-color: #3A3A40;
    }

    .daytab.on {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      box-shadow: 0 8px 24px -14px var(--red);
    }

    .daytab .dot {
      width: 5px;
      height: 5px;
      border-radius: 99px;
      background: var(--line);
    }

    .daytab .dot.filled {
      background: var(--red);
    }

    .daytab.on .dot,
    .daytab.on .dot.filled {
      background: rgba(255, 255, 255, .85);
    }

    /* ---------- Set chips ---------- */
    .set-chip {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      flex: 1;
      min-width: 0;
      min-height: 52px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--txt-2);
      cursor: pointer;
      transition: all .16s ease;
    }

    .set-chip:hover {
      border-color: #3A3A40;
      color: #fff;
    }

    .set-chip .n {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
    }

    .set-chip .kg {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .06em;
      opacity: .85;
    }

    .set-chip.done {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      animation: setPop .32s cubic-bezier(.34, 1.56, .64, 1);
    }

    /* ---------- Timer ---------- */
    .timer-dock {
      background: rgba(11, 11, 11, .96);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      box-shadow: 0 -8px 40px -20px #000, 0 0 0 1px rgba(0, 0, 0, .6);
    }

    .timer-dock.running {
      border-color: var(--red-line);
    }

    .timer-dock.done {
      border-color: var(--red);
      animation: flashRed 1.1s ease-in-out 3;
    }

    .timer-digits {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--red);
      box-shadow: 0 0 0 0 rgba(225, 6, 0, .7);
      animation: livePulse 1.8s infinite;
    }

    /* ---------- Progresso circular / diversos ---------- */
    .divider {
      height: 1px;
      background: var(--line);
      width: 100%;
    }

    .stat-num {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 34px;
      line-height: 1;
      letter-spacing: .01em;
    }

    .num-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: var(--surface-3);
      border: 1px solid var(--line);
      color: var(--txt-2);
      flex-shrink: 0;
    }

    .num-badge.on {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    .scale-track {
      display: flex;
      height: 10px;
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--line-soft);
    }

    /* ---------- Layout ---------- */
    .app-main {
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 24px);
    }

    .dock-wrap {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 35;
      bottom: calc(var(--nav-h) + var(--safe-b) + 6px);
      pointer-events: none;
    }

    .dock-wrap>* {
      pointer-events: auto;
    }

    @media (min-width: 1024px) {
      .app-main {
        padding-bottom: 140px;
      }

      .dock-wrap {
        bottom: 16px;
        left: 240px;
        padding-left: 24px;
        padding-right: 24px;
      }
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary {
      list-style: none;
    }

    details[open] summary svg:last-child {
      transform: rotate(180deg);
    }

    /* ---------- Scroll ---------- */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .thin-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .thin-scroll::-webkit-scrollbar-thumb {
      background: #2A2A2E;
      border-radius: 99px;
    }

    /* ---------- Foco visível / acessibilidade ---------- */
    :focus-visible {
      outline: 2px solid var(--red-hi);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ---------- Animações ---------- */
    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes dropIn {
      from {
        opacity: 0;
        transform: translate(-50%, -14px)
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0)
      }
    }

    @keyframes sheetIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(.99)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes setPop {
      0% {
        transform: scale(.9)
      }

      55% {
        transform: scale(1.06)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes livePulse {
      0% {
        box-shadow: 0 0 0 0 rgba(225, 6, 0, .65)
      }

      70% {
        box-shadow: 0 0 0 9px rgba(225, 6, 0, 0)
      }

      100% {
        box-shadow: 0 0 0 0 rgba(225, 6, 0, 0)
      }
    }

    @keyframes flashRed {

      0%,
      100% {
        background: rgba(11, 11, 11, .96)
      }

      50% {
        background: rgba(225, 6, 0, .22)
      }
    }

    @keyframes barSweep {
      from {
        transform: translateX(-100%)
      }

      to {
        transform: translateX(100%)
      }
    }

    .a-fade {
      animation: fadeIn .18s ease-out
    }

    .a-rise {
      animation: riseIn .3s cubic-bezier(.16, 1, .3, 1) both
    }

    .a-drop {
      animation: dropIn .28s cubic-bezier(.16, 1, .3, 1) both
    }

    .a-sheet {
      animation: sheetIn .26s cubic-bezier(.16, 1, .3, 1) both
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    body.reduce-motion *,
    body.reduce-motion *::before,
    body.reduce-motion *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <noscript>Este aplicativo precisa de JavaScript habilitado.</noscript>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    Babel.registerPreset('react-classic', {
      presets: [
        [Babel.availablePresets['react'], { runtime: 'classic' }]
      ]
    });
  </script>

  <script type="text/babel" data-presets="react-classic">
    const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;

    /* ============================================================
       1. UTILITÁRIOS
       ============================================================ */
    const DAYS = ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];
    const DAY_FULL = { segunda: 'Segunda-feira', terca: 'Terça-feira', quarta: 'Quarta-feira', quinta: 'Quinta-feira', sexta: 'Sexta-feira' };
    const DAY_SHORT = { segunda: 'SEG', terca: 'TER', quarta: 'QUA', quinta: 'QUI', sexta: 'SEX' };
    const CARDIO_MODALITIES = ['Bike', 'Esteira', 'Corrida', 'Corda', 'Caminhada inclinada'];

    const pad = (n) => String(n).padStart(2, '0');
    const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
    const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

    /** ms -> "MM:SS" ou "H:MM:SS" */
    function fmtClock(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const s = total % 60, m = Math.floor(total / 60) % 60, h = Math.floor(total / 3600);
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    }
    /** segundos -> "MM:SS" */
    const fmtSecs = (secs) => `${pad(Math.floor(Math.max(0, secs) / 60))}:${pad(Math.max(0, secs) % 60)}`;
    const toMin = (ms) => Math.max(0, Math.round(ms / 60000));
    function fmtDuration(ms) {
      const m = toMin(ms);
      return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${pad(m % 60)}m`;
    }
    const fmtNumber = (n) => Math.round(n).toLocaleString('pt-BR');
    const fmtDate = (ts) => new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' }).replace('.', '').toUpperCase();
    const fmtTime = (ts) => new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    const dayStamp = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

    /** Identificador ISO da semana: "2026-W33" */
    function weekIdOf(ts) {
      const d = new Date(ts);
      d.setHours(0, 0, 0, 0);
      d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
      const week1 = new Date(d.getFullYear(), 0, 4);
      const week = 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
      return `${d.getFullYear()}-W${pad(week)}`;
    }
    const currentWeekId = () => weekIdOf(Date.now());
    function weekLabel(weekId) {
      const [y, w] = weekId.split('-W');

    function repsMid(reps) {

      if (!r || /s\b|seg|min/i.test(r)) return 0;
      const range = r.match(/(\d+)\s*[-–a]\s*(\d+)/);
      if (range) return Math.round((parseInt(range[1]) + parseInt(range[2])) / 2);
      const one = r.match(/(\d+)/);
      return one ? parseInt(one[1]) : 0;
    }

    /* ============================================================
       4. MIGRAÇÕES (compatibilidade com dados antigos)
       ============================================================ */
    function splitAlternatives(name) {
      const m = String(name || '').match(/^(.*?)\s+ou\s+(.*)$/i);
      if (!m) return [];
      const left = m[1].trim(), right = m[2].trim();
      if (!left || !right) return [];
      // "Stiff com Halteres ou Barra" -> prefixo comum é reaproveitado
      const words = left.split(/\s+/);
      if (words.length > 1 && right.split(/\s+/).length === 1) {
        return [left, `${words.slice(0, -1).join(' ')} ${right}`];
      }
      return [left, right];
    }

    function displayName(ex) {
      if (ex && Array.isArray(ex.alternatives) && ex.alternatives.length > 1) {
        return ex.alternatives.join(' / ');
      }
      return (ex && ex.name) || 'Exercício';
    }

    function normalizeExercise(ex) {
      const name = String(ex.name || '').trim();
      const alts = Array.isArray(ex.alternatives) && ex.alternatives.length > 1
        ? ex.alternatives.map(a => String(a).trim()).filter(Boolean)
        : splitAlternatives(name);
      return {
        name,
        alternatives: alts.length > 1 ? alts : [],
        sets: clamp(parseInt(ex.sets) || 1, 1, 12),
        reps: ex.reps === '-' ? '' : String(ex.reps == null ? '' : ex.reps),
        obs: String(ex.obs || ''),
        videoLink: String(ex.videoLink || ex.customSearch || '')
      };
    }

    /** Aceita o formato antigo (cardio como exercício, sem alternativas) e converte para v2. */
    function migrateWorkout(raw) {
      if (!raw || typeof raw !== 'object') return deepCopy(defaultWorkoutData);
      const out = { version: 2 };
      let found = 0;
      DAYS.forEach(day => {
        const src = raw[day];
        const fallback = defaultWorkoutData[day];
        if (!src || !Array.isArray(src.exercises)) { out[day] = deepCopy(fallback); return; }
        found++;
        const exercises = [];
        let cardio = src.cardio && typeof src.cardio === 'object' ? { ...src.cardio } : null;
        src.exercises.forEach(ex => {
          if (!ex) return;
          const nm = String(ex.name || '').toLowerCase();
          if (/^c[áa]rdio/.test(nm.trim())) {
            if (!cardio) {
              const opts = String(ex.obs || '').match(/^(.*?)\s+ou\s+(.*)$/i);
              cardio = {
                duration: String(ex.reps || fallback.cardio.duration),
                options: opts ? [opts[1].trim(), opts[2].trim()] : [],
                note: opts ? '' : String(ex.obs || '')
              };
            }
            return;
          }
          exercises.push(normalizeExercise(ex));
        });
        out[day] = {
          name: String(src.name || (src.title || '').split(':')[1] || fallback.name).trim(),
          title: String(src.title || fallback.title),
          focus: String(src.focus || fallback.focus).replace(/\s*\+\s*Cardio\s*$/i, '').replace(/\s*\/\s*/g, ' • '),
          cardio: cardio ? {
            duration: String(cardio.duration || fallback.cardio.duration),
            options: Array.isArray(cardio.options) ? cardio.options.filter(Boolean) : [],
            note: String(cardio.note || '')
          } : deepCopy(fallback.cardio),
          exercises: exercises.length ? exercises : deepCopy(fallback.exercises)
        };
      });
      return found ? out : deepCopy(defaultWorkoutData);
    }

    function migrateSettings(raw) {
      if (typeof raw === 'number' || typeof raw === 'string') {
        const n = parseInt(raw);
        return { ...defaultSettings, restSeconds: isFinite(n) ? clamp(n, 10, 600) : 60 };
      }
      if (!raw || typeof raw !== 'object') return { ...defaultSettings };
      return {
        ...defaultSettings,
        ...raw,
        version: 2,
        restSeconds: clamp(parseInt(raw.restSeconds) || 60, 10, 600)
      };
    }

    /** Progresso passa a ser vinculado à semana ISO. O mapa plano antigo é preservado. */
    function migrateProgress(raw) {
      const week = currentWeekId();
      const empty = { version: 2, weekId: week, sets: {}, setWeights: {}, variants: {} };
      if (!raw || typeof raw !== 'object') return empty;
      if (raw.version === 2) {
        return {
          version: 2,
          weekId: String(raw.weekId || week),
          sets: raw.sets && typeof raw.sets === 'object' ? raw.sets : {},
          setWeights: raw.setWeights && typeof raw.setWeights === 'object' ? raw.setWeights : {},
          variants: raw.variants && typeof raw.variants === 'object' ? raw.variants : {}
        };
      }
      const sets = {};
      Object.keys(raw).forEach(k => { if (raw[k] === true) sets[k] = true; });
      return { ...empty, sets };
    }

    function migrateWeights(raw) {
      if (!raw || typeof raw !== 'object') return {};
      const out = {};
      Object.keys(raw).forEach(k => {
        const v = raw[k];
        if (v === '' || v === null || v === undefined) return;
        out[k] = String(v);
      });
      return out;
    }

    function migrateHistoryEntry(e) {
      if (!e || typeof e !== 'object') return null;
      const date = Number(e.date) || Date.now();
      if (e.version === 2) {
        return {
          ...e,
          id: e.id || uid(),
          date,
          weekId: e.weekId || weekIdOf(date),
          exercises: Array.isArray(e.exercises) ? e.exercises : []
        };
      }
      // Formato antigo: { date, day, duration, exercises:<número>, weights }
      const rawDay = String(e.day || '');
      const isCardio = /c[áa]rdio/i.test(rawDay);
      const legacyCount = Number(e.exercises) || 0;
      return {
        version: 2,
        legacy: true,
        id: `legacy-${date}`,
        date,
        weekId: weekIdOf(date),
        type: isCardio ? 'cardio' : 'strength',
        day: isCardio ? null : (DAYS.includes(rawDay) ? rawDay : null),
        dayName: isCardio ? rawDay.replace(/^c[áa]rdio:\s*/i, '') : '',

        exercisesCompleted: null,
        totalExercises: null,
        totalSets: isCardio ? 0 : legacyCount,
        volume: 0,
        exercises: []
      };
    }

    function migrateHistory(raw) {
      if (!Array.isArray(raw)) return [];
      return raw.map(migrateHistoryEntry).filter(Boolean).sort((a, b) => a.date - b.date);
    }

    function migrateStats(raw) {
      if (!raw || typeof raw !== 'object') return { ...defaultUserStats };
      const log = Array.isArray(raw.weightLog) ? raw.weightLog.filter(x => x && x.date && x.weight) : [];
      const merged = {
        ...defaultUserStats,
        ...raw,
        version: 2,
        weight: raw.weight == null ? '' : String(raw.weight),
        height: raw.height == null ? '' : String(raw.height),
        goalWeight: raw.goalWeight == null ? '' : String(raw.goalWeight),

        water: raw.water && typeof raw.water === 'object' ? raw.water : { date: '', cups: 0 }
      };
      if (!merged.startWeight && merged.weight) merged.startWeight = merged.weight;
      if (merged.weight && !merged.weightLog.length) {
        merged.weightLog = [{ date: dayStamp(Date.now()), weight: num(merged.weight) }];
      }
      return merged;
    }

    function migrateSession(raw) {
      const MAX = 12 * 60 * 60 * 1000;
      let obj = null;
      if (typeof raw === 'number') obj = { startedAt: raw, day: todayDayKey() };
      else if (raw && typeof raw === 'object' && raw.startedAt) obj = { startedAt: Number(raw.startedAt), day: DAYS.includes(raw.day) ? raw.day : todayDayKey() };
      if (!obj || !isFinite(obj.startedAt)) return null;
      if (Date.now() - obj.startedAt > MAX) return null;
      return obj;
    }

    function migrateCardio(raw) {
      const MAX = 12 * 60 * 60 * 1000;
      let obj = null;
      if (typeof raw === 'number') obj = { startedAt: raw, modality: 'Bike', day: todayDayKey() };
      else if (raw && typeof raw === 'object' && raw.startedAt) obj = { startedAt: Number(raw.startedAt), modality: String(raw.modality || 'Bike'), day: raw.day || todayDayKey() };
      if (!obj || !isFinite(obj.startedAt)) return null;
      if (Date.now() - obj.startedAt > MAX) return null;
      return obj;
    }

      refresh: <React.Fragment><polyline points="23 4 23 10 17 10" /><polyline points="1 20 1 14 7 14" /><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" /></React.Fragment>,
      info: <React.Fragment><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></React.Fragment>,
      alert: <React.Fragment><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></React.Fragment>,
      calendar: <React.Fragment><rect x="3" y="4" width="18" height="18" rx="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></React.Fragment>,
      bike: <React.Fragment><circle cx="5.5" cy="17.5" r="3.5" /><circle cx="18.5" cy="17.5" r="3.5" /><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 17.5V14l-3-3 4-3 2 3h2" /></React.Fragment>,
      trophy: <React.Fragment><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M6 4h12v5a6 6 0 0 1-12 0V4z" /><line x1="12" y1="15" x2="12" y2="19" /><line x1="8" y1="21" x2="16" y2="21" /></React.Fragment>,
      layers: <React.Fragment><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></React.Fragment>,
      video: <React.Fragment><polygon points="23 7 16 12 23 17 23 7" /><rect x="1" y="5" width="15" height="14" rx="2" /></React.Fragment>,
      book: <React.Fragment><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></React.Fragment>,
      scale: <React.Fragment><circle cx="12" cy="12" r="9" /><path d="M12 12l4-4" /><path d="M9 21h6" /></React.Fragment>,
      copy: <React.Fragment><rect x="9" y="9" width="13" height="13" rx="2" ry="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></React.Fragment>
    };

    const Icon = memo(({ name, size = 20, className = '', strokeWidth = 2, fill = 'none' }) => {
      const p = PATHS[name];
      if (!p) return null;
      return (
        <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
          strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
          className={className} aria-hidden="true" focusable="false">{p}</svg>
      );
    });

    /* ============================================================
       6. PRIMITIVOS DE UI
       ============================================================ */
    const ProgressBar = ({ value, className = '', thick = false, thin = false }) => (
      <div className={`bar ${thick ? 'bar-thick' : ''} ${thin ? 'bar-thin' : ''} ${className}`}
        role="progressbar" aria-valuenow={Math.round(value)} aria-valuemin="0" aria-valuemax="100">
        <div className="bar-fill" style={{ width: `${clamp(value, 0, 100)}%` }} />
      </div>
    );

    const Eyebrow = ({ children, red = false, className = '' }) => (
      <div className={`eyebrow ${red ? 'eyebrow-red' : ''} ${className}`}>{children}</div>
    );

    const SectionTitle = ({ children, action }) => (
      <div className="flex items-end justify-between gap-3 mb-3">
        <h2 className="display text-2xl text-white">{children}</h2>
        {action}
      </div>
    );

    const EmptyState = ({ icon, title, text, action }) => (
      <div className="card p-8 text-center">
        <div className="text-faint mb-3 flex justify-center"><Icon name={icon} size={34} /></div>
        <h3 className="display text-xl text-white mb-1">{title}</h3>
        <p className="text-sm text-soft mb-4">{text}</p>
        {action}
      </div>
    );

    const StatTile = ({ label, value, unit, icon, hint }) => (
      <div className="card p-4">
        <div className="flex items-center justify-between mb-2">
          <Eyebrow>{label}</Eyebrow>
          {icon ? <span className="text-brand"><Icon name={icon} size={15} /></span> : null}
        </div>
        <div className="flex items-baseline gap-1">
          <span className="stat-num text-white">{value}</span>
          {unit ? <span className="text-xs font-bold text-faint uppercase">{unit}</span> : null}
        </div>
        {hint ? <div className="text-[11px] text-faint mt-1">{hint}</div> : null}
      </div>
    );

    /** Modal genérico (confirmação / alerta / conteúdo livre) */
    const Modal = ({ open, title, eyebrow, children, onClose, onConfirm, confirmLabel = 'Confirmar', cancelLabel = 'Cancelar', danger = false, hideCancel = false, size = 'sm' }) => {
      useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        document.body.style.overflow = 'hidden';
        return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
      }, [open, onClose]);

      if (!open) return null;
      return (
        <div className="fixed inset-0 z-[120] flex items-end sm:items-center justify-center p-3 sm:p-6 bg-black/80 a-fade"
          role="dialog" aria-modal="true" aria-label={title} onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div className={`card a-sheet w-full ${size === 'lg' ? 'max-w-2xl' : 'max-w-md'} max-h-[88vh] overflow-y-auto thin-scroll`}>
            <div className="p-5 border-b hairline flex items-start justify-between gap-4">
              <div>
                {eyebrow ? <Eyebrow red className="mb-1">{eyebrow}</Eyebrow> : null}
                <h3 className="display text-2xl text-white">{title}</h3>
              </div>
              <button className="btn btn-ghost btn-icon" onClick={onClose} aria-label="Fechar"><Icon name="x" size={18} /></button>
            </div>
            <div className="p-5 text-sm text-soft leading-relaxed">{children}</div>
            <div className="p-5 pt-0 flex gap-2">
              {!hideCancel && <button className="btn btn-ghost flex-1" onClick={onClose}>{cancelLabel}</button>}
              {onConfirm ? (
                <button className={`btn flex-1 ${danger ? 'btn-danger' : 'btn-primary'}`}
                  onClick={() => { onConfirm(); onClose(); }}>{confirmLabel}</button>
              ) : hideCancel ? (
                <button className="btn btn-dark flex-1" onClick={onClose}>Fechar</button>
              ) : null}
            </div>
          </div>
        </div>
      );
    };

    const Toast = ({ toast, onClose }) => {
      if (!toast.open) return null;
      const accent = toast.type === 'error' ? 'border-brand text-white' : 'hairline text-white';
      return (
        <div className="fixed left-1/2 z-[130] w-[92%] max-w-sm a-drop" style={{ top: 'calc(12px + env(safe-area-inset-top, 0px))' }} role="status" aria-live="polite">
          <div className={`card ${accent} px-4 py-3 flex items-center gap-3`} style={{ background: '#101012' }}>
            <span className={toast.type === 'error' ? 'text-brand' : 'text-brand'}>
              <Icon name={toast.type === 'error' ? 'alert' : toast.type === 'success' ? 'checkCircle' : 'info'} size={18} />
            </span>
            <span className="text-sm font-semibold flex-1">{toast.message}</span>
            <button onClick={onClose} aria-label="Fechar aviso" className="text-faint hover:text-white"><Icon name="x" size={16} /></button>
          </div>
        </div>
      );
    };

    /** Gráfico Chart.js com ciclo de vida controlado */
    const ChartBox = ({ type, labels, datasets, height = 200, yTitle, stepSize }) => {
      const canvasRef = useRef(null);
      const instRef = useRef(null);
      const payload = JSON.stringify({ type, labels, datasets, yTitle, stepSize });

      useEffect(() => {
        if (!canvasRef.current || typeof Chart === 'undefined') return;
        const cfg = JSON.parse(payload);
        const grid = 'rgba(255,255,255,0.06)';
        const tick = '#71717A';
        instRef.current = new Chart(canvasRef.current.getContext('2d'), {
          type: cfg.type,
          data: {
            labels: cfg.labels,
            datasets: cfg.datasets.map((d, i) => ({
              borderColor: d.color || (i === 0 ? '#E10600' : '#FFFFFF'),
              backgroundColor: cfg.type === 'bar'
                ? (d.color || (i === 0 ? '#E10600' : '#FFFFFF'))
                : (d.fillColor || 'rgba(225,6,0,0.12)'),
              borderWidth: 2,
              pointBackgroundColor: d.color || '#E10600',
              pointBorderColor: '#050505',
              pointRadius: 3,
              pointHoverRadius: 5,
              tension: 0.35,
              fill: cfg.type === 'line',
              borderRadius: cfg.type === 'bar' ? 4 : 0,
              maxBarThickness: 34,
              ...d
            }))
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: {
                display: cfg.datasets.length > 1,
                labels: { color: '#A1A1AA', boxWidth: 10, boxHeight: 10, usePointStyle: true, font: { family: 'Inter', size: 11, weight: '700' } }
              },
              tooltip: {
                backgroundColor: '#111111', borderColor: '#27272A', borderWidth: 1,
                titleColor: '#fff', bodyColor: '#A1A1AA', padding: 10, displayColors: false,
                titleFont: { family: 'Inter', weight: '700' }, bodyFont: { family: 'JetBrains Mono' }
              }
            },
            scales: {
              x: { ticks: { color: tick, font: { family: 'Inter', size: 10, weight: '600' } }, grid: { color: 'transparent' }, border: { color: '#27272A' } },
              y: {
                beginAtZero: true,
                ticks: { color: tick, font: { family: 'JetBrains Mono', size: 10 }, stepSize: cfg.stepSize, precision: 0 },
                grid: { color: grid }, border: { display: false },
                title: cfg.yTitle ? { display: true, text: cfg.yTitle, color: '#52525B', font: { family: 'Inter', size: 10, weight: '700' } } : undefined
              }
            }
          }
        });
        return () => { if (instRef.current) { instRef.current.destroy(); instRef.current = null; } };
      }, [payload]);

      return <div style={{ height }}><canvas ref={canvasRef} /></div>;
    };

    /* ============================================================
       7. CONTEXTO DO APP
       ============================================================ */
    const Ctx = React.createContext({});
    const useApp = () => React.useContext(Ctx);

    /* ============================================================
       8. NAVEGAÇÃO
       ============================================================ */
    const NAV = [
      { id: 'workout', label: 'Treino', icon: 'dumbbell' },
      { id: 'stats', label: 'Progresso', icon: 'chart' },
      { id: 'history', label: 'Histórico', icon: 'history' },
      { id: 'profile', label: 'Perfil', icon: 'user' }
    ];
    const VIEW_PARENT = { workout: 'workout', cardio: 'workout', stats: 'stats', history: 'history', profile: 'profile', settings: 'profile', editor: 'profile' };

    const BottomNavigation = ({ view, onChange, sessionRunning }) => (
      <nav className="lg:hidden fixed bottom-0 left-0 right-0 z-40 border-t hairline"
        style={{ background: 'rgba(5,5,5,.94)', backdropFilter: 'blur(14px)', paddingBottom: 'var(--safe-b)' }}
        aria-label="Navegação principal">
        <div className="flex max-w-2xl mx-auto">
          {NAV.map(item => {
            const on = VIEW_PARENT[view] === item.id;
            return (
              <button key={item.id} className={`nav-item ${on ? 'on' : ''}`} onClick={() => onChange(item.id)}
                aria-current={on ? 'page' : undefined} aria-label={item.label}>
                <span className="relative">
                  <Icon name={item.icon} size={20} />
                  {item.id === 'workout' && sessionRunning && (
                    <span className="absolute -top-1 -right-2 live-dot" aria-hidden="true" />
                  )}
                </span>
                {item.label}
              </button>
            );
          })}
        </div>
      </nav>
    );

    const SideNavigation = ({ view, onChange, sessionRunning }) => (
      <aside className="hidden lg:flex flex-col fixed left-0 top-0 bottom-0 w-60 border-r hairline p-5 z-40"
        style={{ background: 'var(--surface)' }} aria-label="Navegação principal">
        <div className="mb-8">
          <div className="flex items-center gap-2">
            <span className="inline-block w-2 h-7" style={{ background: 'var(--red)' }} />
            <span className="display text-3xl text-white">Iron<span className="text-brand">Track</span></span>
          </div>
          <div className="eyebrow mt-2">Treino • Registro • Evolução</div>
        </div>
        <div className="flex flex-col gap-1">
          {NAV.map(item => {
            const on = VIEW_PARENT[view] === item.id;
            return (
              <button key={item.id} className={`nav-side ${on ? 'on' : ''}`} onClick={() => onChange(item.id)} aria-current={on ? 'page' : undefined}>
                <Icon name={item.icon} size={18} />
                <span className="flex-1 text-left">{item.label}</span>
                {item.id === 'workout' && sessionRunning && <span className="live-dot" aria-hidden="true" />}
              </button>
            );
          })}
        </div>
        <div className="mt-auto text-[11px] text-faint leading-relaxed">
          Seus dados ficam apenas neste dispositivo.
        </div>
      </aside>
    );

    /** Cabeçalho de telas internas */
    const ScreenHeader = ({ eyebrow, title, subtitle, onBack, right }) => (
      <header className="pt-6 pb-4">
        {onBack && (
          <button className="btn btn-ghost btn-sm mb-4" onClick={onBack}>
            <Icon name="arrowLeft" size={15} /> Voltar
          </button>
        )}
        <div className="flex items-end justify-between gap-4">
          <div className="min-w-0">
            {eyebrow ? <Eyebrow red className="mb-1">{eyebrow}</Eyebrow> : null}
            <h1 className="display text-4xl sm:text-5xl text-white">{title}</h1>
            {subtitle ? <p className="text-sm text-soft mt-1">{subtitle}</p> : null}
          </div>
          {right}
        </div>
      </header>
    );

    /* ============================================================
       9. TIMER DE DESCANSO
       ============================================================ */
    const RestTimer = ({ rest, total, onStart, onPause, onResume, onReset, onExtend }) => {
      const pct = total > 0 ? ((total - rest.remaining) / total) * 100 : 0;
      const state = rest.status;
      const label = state === 'running' ? 'Descansando' : state === 'paused' ? 'Pausado' : state === 'done' ? 'Descanso finalizado' : 'Descanso';

      return (
        <div className={`timer-dock p-3 sm:p-4 ${state === 'running' ? 'running' : ''} ${state === 'done' ? 'done' : ''}`}>
          <div className="flex items-center gap-3">
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 mb-1">
                {state === 'running' && <span className="live-dot" aria-hidden="true" />}
                <span className={`eyebrow ${state === 'done' ? 'eyebrow-red' : ''}`}>{label}</span>
              </div>
              <div className={`timer-digits text-3xl sm:text-4xl ${state === 'done' ? 'text-brand' : 'text-white'}`} aria-live="off">
                {fmtSecs(rest.remaining)}
              </div>
            </div>
            <div className="flex gap-2">
              <button className="btn btn-ghost btn-icon" onClick={onExtend} aria-label="Somar 15 segundos ao descanso">
                <span className="text-xs font-bold">+15</span>
              </button>
              <button className="btn btn-ghost btn-icon" onClick={onReset} aria-label="Resetar descanso">
                <Icon name="refresh" size={17} />
              </button>
              {state === 'running' ? (
                <button className="btn btn-dark px-5" onClick={onPause} aria-label="Pausar descanso"><Icon name="pause" size={16} fill="currentColor" /> Pausar</button>
              ) : (
                <button className="btn btn-primary px-5" onClick={state === 'paused' ? onResume : onStart}
                  aria-label={state === 'paused' ? 'Retomar descanso' : 'Iniciar descanso'}>
                  <Icon name="play" size={16} fill="currentColor" /> {state === 'paused' ? 'Retomar' : 'Iniciar'}
                </button>
              )}
            </div>
          </div>
          <ProgressBar value={state === 'idle' ? 0 : pct} thin className="mt-3" />
        </div>
      );
    };

    /* ============================================================
       10. CRONÔMETRO DO TREINO
       ============================================================ */
    const WorkoutTimer = ({ elapsed, dayName, onFinish, compact }) => (
      <div className={`card card-active ${compact ? 'p-3' : 'p-4'} flex items-center gap-3`}>
        <span className="live-dot" aria-hidden="true" />
        <div className="min-w-0 flex-1">
          <Eyebrow red>Treino em andamento</Eyebrow>
          <div className="flex items-baseline gap-2">
            <span className="timer-digits text-2xl sm:text-3xl text-white">{fmtClock(elapsed)}</span>
            <span className="text-xs text-faint truncate uppercase font-bold tracking-wider">{dayName}</span>
          </div>
        </div>
        <button className="btn btn-primary btn-sm sm:min-h-[46px]" onClick={onFinish}>
          <Icon name="check" size={16} /> Finalizar
        </button>
      </div>
    );

    /* ============================================================
       11. TABS DE DIA
       ============================================================ */
    const WorkoutTabs = ({ days, active, onSelect, progressByDay, today }) => (
      <div className="grid grid-cols-5 gap-1.5 sm:gap-2">
        {days.map(day => {
          const p = progressByDay[day] || { done: 0, total: 0 };
          const complete = p.total > 0 && p.done === p.total;
          return (
            <button key={day} className={`daytab ${active === day ? 'on' : ''}`} onClick={() => onSelect(day)}
              aria-pressed={active === day}
              aria-label={`${DAY_FULL[day]} — ${p.done} de ${p.total} exercícios concluídos`}>
              <span>{DAY_SHORT[day]}</span>
              <span className="flex gap-1 items-center h-2">
                {complete
                  ? <Icon name="check" size={12} strokeWidth={3} />
                  : <span className={`dot ${p.done > 0 ? 'filled' : ''}`} />}
                {day === today && <span className="text-[8px] font-black tracking-widest opacity-70">HOJE</span>}
              </span>
            </button>
          );
        })}
      </div>
    );

    /* ============================================================
       12. CARD DE EXERCÍCIO + REGISTRO DE SÉRIES
       ============================================================ */
    const SetTracker = ({ exercise, sets, onToggle, onSetWeight, baseWeight }) => {
      const [detail, setDetail] = useState(false);
      return (
        <div>
          <div className="flex items-center justify-between mb-2">
            <Eyebrow>Séries</Eyebrow>
            <button className="text-[11px] font-bold text-faint hover:text-white flex items-center gap-1"
              onClick={() => setDetail(d => !d)} aria-expanded={detail}>
              Carga por série <Icon name={detail ? 'chevronDown' : 'chevronRight'} size={12} />
            </button>
          </div>

          <div className="flex gap-1.5">
            {sets.map((s, i) => (
              <button key={i} className={`set-chip ${s.done ? 'done' : ''}`} onClick={() => onToggle(i)}
                aria-pressed={s.done}
                aria-label={`Série ${i + 1}${s.done ? ' concluída' : ''}${s.weight ? `, ${s.weight} quilos` : ''}`}>
                {s.done
                  ? <React.Fragment><Icon name="check" size={16} strokeWidth={3} /><span className="kg">{s.weight ? `${s.weight}KG` : `SÉRIE ${i + 1}`}</span></React.Fragment>
                  : <React.Fragment><span className="n">{pad(i + 1)}</span><span className="kg text-faint">SÉRIE</span></React.Fragment>}
              </button>
            ))}
          </div>

          {detail && (
            <div className="mt-3 space-y-2 a-fade">
              {sets.map((s, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className={`num-badge ${s.done ? 'on' : ''}`}>{pad(i + 1)}</span>
                  <div className="flex-1 flex items-center gap-2">
                    <input type="number" inputMode="decimal" step="0.5" min="0" className="input input-num h-11"
                      value={s.rawWeight} placeholder={baseWeight || '0'}
                      onChange={(e) => onSetWeight(i, e.target.value)}
                      aria-label={`Carga da série ${i + 1} em quilos`} />
                    <span className="text-xs font-bold text-faint">KG</span>
                  </div>
                  <button className={`btn ${s.done ? 'btn-primary' : 'btn-ghost'} btn-icon`} onClick={() => onToggle(i)}
                    aria-label={s.done ? `Desmarcar série ${i + 1}` : `Marcar série ${i + 1} como concluída`}>
                    <Icon name="check" size={17} strokeWidth={3} />
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const ExerciseCard = ({ index, day, exercise, sets, weight, variant, loadInfo, onToggleSet, onSetWeight, onWeight, onVariant }) => {
      const total = sets.length;
      const done = sets.filter(s => s.done).length;
      const complete = total > 0 && done === total;
      const name = variant || displayName(exercise);
      const alts = exercise.alternatives || [];

      const bump = (delta) => {
        const next = Math.max(0, num(weight) + delta);
        onWeight(next ? String(next) : '');
      };

      return (
        <article className={`card ${complete ? 'card-done' : ''} ${done > 0 && !complete ? 'card-active' : ''} p-4 a-rise`}
          aria-label={`Exercício ${index + 1}: ${name}`}>
          {/* topo */}
          <div className="flex items-start gap-3 mb-3">
            <div className={`display text-3xl leading-none ${complete ? 'text-brand' : 'text-faint'}`} aria-hidden="true">
              {pad(index + 1)}
            </div>
            <div className="flex-1 min-w-0">
              <h3 className="font-extrabold text-[17px] leading-tight text-white break-words">{name}</h3>
              <p className="text-xs text-soft mt-0.5">
                {exercise.sets} séries × {exercise.reps ? `${exercise.reps} reps` : 'reps livres'}
              </p>
            </div>
            {complete ? (
              <span className="badge badge-red a-fade"><Icon name="check" size={11} strokeWidth={3} /> Concluído</span>
            ) : done > 0 ? (
              <span className="badge badge-outline-red">{done}/{total}</span>
            ) : null}
          </div>

          {/* variações */}
          {alts.length > 1 && (
            <div className="mb-3">
              <Eyebrow className="mb-1.5">Variação realizada</Eyebrow>
              <div className="flex flex-wrap gap-1.5">
                {alts.map(alt => (
                  <button key={alt} className={`chip btn-sm ${variant === alt ? 'chip-on' : ''}`}
                    onClick={() => onVariant(variant === alt ? '' : alt)} aria-pressed={variant === alt}>
                    {alt}
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* carga */}
          <div className="card-2 p-3 mb-3">
            <div className="flex items-center gap-2">
              <div className="flex-1">
                <label className="label" htmlFor={`w-${day}-${index}`}>Carga atual</label>
                <div className="flex items-center gap-2">
                  <button className="btn btn-ghost btn-icon" onClick={() => bump(-2.5)} aria-label="Diminuir carga em 2,5 kg"><Icon name="minus" size={16} /></button>
                  <div className="relative flex-1">
                    <input id={`w-${day}-${index}`} type="number" inputMode="decimal" step="0.5" min="0"
                      className="input input-num pr-8" placeholder="0"
                      value={weight} onChange={(e) => onWeight(e.target.value)} />
                    <span className="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-faint pointer-events-none">KG</span>
                  </div>
                  <button className="btn btn-ghost btn-icon" onClick={() => bump(2.5)} aria-label="Aumentar carga em 2,5 kg"><Icon name="plus" size={16} /></button>
                </div>
              </div>
            </div>
            {(loadInfo.last || loadInfo.best) && (
              <div className="flex gap-4 mt-3 pt-3 border-t hairline">
                {loadInfo.last ? (
                  <div><Eyebrow>Último treino</Eyebrow><div className="mono text-sm font-bold text-white">{loadInfo.last} kg</div></div>
                ) : null}
                {loadInfo.best ? (
                  <div><Eyebrow>Melhor carga</Eyebrow><div className="mono text-sm font-bold text-brand">{loadInfo.best} kg</div></div>
                ) : null}
              </div>
            )}
          </div>

          <SetTracker exercise={exercise} sets={sets} onToggle={onToggleSet} onSetWeight={onSetWeight} baseWeight={weight} />

          {exercise.obs ? (
            <p className="flex items-start gap-2 text-xs text-soft mt-3 pt-3 border-t hairline">
              <span className="text-faint mt-0.5"><Icon name="info" size={13} /></span>{exercise.obs}

          ) : null}

          <a href={youtubeUrl(name, exercise.videoLink)} target="_blank" rel="noopener noreferrer"
            className="btn btn-ghost w-full mt-3" aria-label={`Ver execução de ${name} no YouTube`}>
            <Icon name="play" size={14} fill="currentColor" /> Ver execução
          </a>
        </article>
      );
    };

    /* ============================================================
       13. BLOCO DE CARDIO DO DIA
       ============================================================ */
    const CardioBlock = ({ cardio, running, elapsed, modality, onModality, onStart, onOpen }) => {
      const options = (cardio.options && cardio.options.length) ? cardio.options : CARDIO_MODALITIES;
      return (
        <section className={`card ${running ? 'card-active' : ''} p-4`} aria-label="Cardio do dia">
          <div className="flex items-start justify-between gap-3 mb-3">
            <div>
              <Eyebrow red>Cardio</Eyebrow>
              <h3 className="display text-2xl text-white mt-1">{cardio.duration}</h3>
              {cardio.note ? <p className="text-xs text-soft mt-0.5">{cardio.note}</p> : null}
            </div>
            <span className="text-brand"><Icon name="bike" size={24} /></span>
          </div>

          {running ? (
            <div className="card-2 p-3 flex items-center gap-3">
              <span className="live-dot" aria-hidden="true" />
              <div className="flex-1">
                <Eyebrow red>Em andamento · {modality}</Eyebrow>
                <div className="timer-digits text-2xl text-white">{fmtClock(elapsed)}</div>

              <Eyebrow className="mb-1.5">Modalidade</Eyebrow>
              <div className="flex flex-wrap gap-1.5 mb-3">
                {options.map(op => (
                  <button key={op} className={`chip btn-sm ${modality === op ? 'chip-on' : ''}`}
                    onClick={() => onModality(op)} aria-pressed={modality === op}>{op}</button>
                ))}
              </div>
              <button className="btn btn-dark w-full" onClick={onStart}>
                <Icon name="play" size={15} fill="currentColor" /> Iniciar cardio
              </button>
            </React.Fragment>
          )}

      );
    };

    /* ============================================================
       14. TELA PRINCIPAL — TREINO
       ============================================================ */
    const WorkoutScreen = () => {
      const app = useApp();
      const { workoutData, activeDay, session, cardio, progress, weights, settings } = app;
      const day = activeDay;
      const workout = workoutData[day];
      const stats = app.dayStats(day);
      const sessionOnThisDay = session && session.day === day;

      return (
        <div className="a-fade">
          <header className="pt-6 pb-5">
            <div className="flex items-start justify-between gap-3">
              <div className="min-w-0">
                <Eyebrow red>Treino</Eyebrow>
                <p className="text-sm text-soft mt-1.5 capitalize">{DAY_FULL[day]}</p>
                <h1 className="display text-5xl sm:text-6xl text-white leading-none mt-0.5">{workout.name}</h1>
                <p className="text-xs text-faint mt-2">{workout.focus}</p>
              </div>
              <button className="btn btn-ghost btn-icon lg:hidden" onClick={() => app.setView('settings')} aria-label="Configurações">
                <Icon name="settings" size={18} />
              </button>
            </div>
          </header>

          {/* Progresso do treino */}

                <span className="mono text-2xl font-bold text-brand">{Math.round(stats.pct)}%</span>
                <div className="text-[11px] text-faint">{stats.setsDone}/{stats.setsTotal} séries</div>
              </div>
            </div>
            <ProgressBar value={stats.pct} thick />
          </section>

          {/* Sessão */}
          <div className="mb-4">
            {session ? (

                <WorkoutTimer elapsed={app.elapsed} dayName={workout.name} onFinish={app.requestFinish} />

                weight={weights[exKey(day, idx)] || ''}
                variant={progress.variants[exKey(day, idx)] || ''}

            </summary>
            <ul className="mt-3 space-y-2">

    /* ============================================================
       15. TELA DE CARDIO

    /* ============================================================

       ============================================================ */
    const WorkoutSummary = ({ data, onSave, onContinue }) => {
      if (!data) return null;
      return (
        <div className="fixed inset-0 z-[125] bg-black/85 flex items-end sm:items-center justify-center p-3 sm:p-6 a-fade"
          role="dialog" aria-modal="true" aria-label="Resumo do treino">

    /* ============================================================
       17. HISTÓRICO
       ============================================================ */
    const HistoryDetails = ({ entry }) => {
      if (entry.type === 'cardio') {
        return (
          <div className="mt-3 pt-3 border-t hairline">
            <Eyebrow className="mb-1">Atividade</Eyebrow>
            <p className="text-sm text-white font-semibold">{entry.modality || 'Cardio'} · {fmtDuration(entry.duration)}</p>
          </div>
        );
      }
      if (!entry.exercises || !entry.exercises.length) {
        return (
          <div className="mt-3 pt-3 border-t hairline">
            <p className="text-xs text-faint">
              {entry.legacy
                ? 'Registro antigo: o app anterior guardava apenas a contagem de séries, sem o detalhamento por exercício.'
                : 'Nenhum exercício detalhado neste registro.'}

          </div>
        );
      }
      return (
        <div className="mt-3 pt-3 border-t hairline space-y-3">
          {entry.exercises.map((ex, i) => (
            <div key={i}>
              <div className="flex items-baseline gap-2 mb-1.5">
                <span className="mono text-[11px] text-faint">{pad(i + 1)}</span>
                <span className="text-sm font-bold text-white flex-1">{ex.name}</span>
                <span className="text-[11px] text-faint">{ex.reps ? `${ex.reps} reps` : ''}</span>
              </div>
              <div className="flex flex-wrap gap-1.5">
                {ex.sets.map((s, j) => (
                  <span key={j} className={`badge ${s.completed ? 'badge-outline-red' : ''}`}>
                    {pad(j + 1)} · {s.weight ? `${s.weight} kg` : '—'}
                  </span>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    };

    const HistoryCard = ({ entry, workoutData, onDelete }) => {
      const [open, setOpen] = useState(false);
      const isCardio = entry.type === 'cardio';
      const title = isCardio
        ? (entry.modality || 'Cardio')
        : (entry.dayName || (entry.day && workoutData[entry.day] ? workoutData[entry.day].name : 'Treino'));

      return (
        <article className="card p-4 a-rise">
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <Eyebrow>{fmtDate(entry.date)} · {fmtTime(entry.date)}</Eyebrow>
              <h3 className="display text-3xl text-white mt-1 truncate">{title}</h3>
            </div>
            <div className="flex items-center gap-1.5">
              <span className={`badge ${isCardio ? 'badge-outline-red' : ''}`}>{isCardio ? 'Cardio' : 'Musculação'}</span>
              <button className="btn btn-ghost btn-icon" onClick={() => onDelete(entry)} aria-label={`Excluir treino de ${title}`}>
                <Icon name="trash" size={15} />
              </button>
            </div>
          </div>

          <div className="flex flex-wrap gap-x-5 gap-y-1 mt-3 text-sm">
            <span className="flex items-center gap-1.5 text-soft"><Icon name="clock" size={14} className="text-faint" />{fmtDuration(entry.duration)}</span>
            {!isCardio && entry.exercisesCompleted != null && (
              <span className="flex items-center gap-1.5 text-soft"><Icon name="dumbbell" size={14} className="text-faint" />{entry.exercisesCompleted} exercícios</span>
            )}
            {!isCardio && entry.totalSets > 0 && (
              <span className="flex items-center gap-1.5 text-soft"><Icon name="layers" size={14} className="text-faint" />{entry.totalSets} séries</span>
            )}
            {!isCardio && entry.volume > 0 && (

          <button className="btn btn-ghost btn-sm w-full mt-3" onClick={() => setOpen(o => !o)} aria-expanded={open}>
